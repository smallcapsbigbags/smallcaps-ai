<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Smallcaps.ai Company Intelligence — the current position, what matters now and the evidence trail.">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="color-scheme" content="light">
  <title>Smallcaps.ai · Company Intelligence</title>
  <link rel="icon" href="/favicon.svg?v={{ASSET_VERSION}}" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/news.css?v={{ASSET_VERSION}}">
  <link rel="stylesheet" href="/assets/watchlist.css?v={{ASSET_VERSION}}">
  <link rel="stylesheet" href="/assets/company-pass4.css?v={{ASSET_VERSION}}">
  <script src="/assets/watchlist.js?v={{ASSET_VERSION}}" defer></script>
  <script src="/assets/company-watchlist.js?v={{ASSET_VERSION}}" defer></script>
  <script src="/assets/company.js?v={{ASSET_VERSION}}" defer></script>
</head>
<body class="company-intelligence-page">
  <a class="skip-link" href="#company-research">Skip to company intelligence</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="/" aria-label="Smallcaps.ai home">
        <span>smallcaps</span><strong>.ai</strong>
      </a>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a class="nav-link" href="/rns">News</a>
        <a id="watchlist-nav-link" class="nav-link" href="/rns?watchlist=1">Watchlist<span id="watchlist-nav-count" class="watchlist-nav-count" hidden>0</span></a>
        <a class="nav-link" href="/">The AIM Daily</a>
      </nav>
      <div class="header-meta">
        <span class="live-status">
          <i aria-hidden="true"></i>
          <span class="status-full">Company Intelligence</span>
          <span class="status-compact">Company</span>
        </span>
        <form action="/logout" method="post">
          <button class="text-action" type="submit">Sign out</button>
        </form>
      </div>
    </div>
  </header>

  <main class="company-shell" id="company-research">
    <section class="company-hero" aria-labelledby="company-title">
      <div class="company-hero-copy">
        <p class="eyebrow">Company Intelligence</p>
        <h1 id="company-title"><span id="company-ticker">—</span><em aria-hidden="true">.</em></h1>
        <div class="company-identity">
          <strong id="company-name">Loading company intelligence…</strong>
          <span id="company-market">AIM</span>
        </div>
        <p id="company-coverage" class="company-coverage" aria-live="polite">Preparing the company record…</p>
      </div>
      <button id="company-watch-toggle" class="company-watch-toggle" type="button" aria-pressed="false">☆ Watch</button>
    </section>

    <div id="company-content" class="company-content" aria-live="polite">
      <div class="company-loading" role="status" aria-label="Loading company intelligence">
        <span></span><span></span><span></span>
      </div>
    </div>

    <noscript>
      <p class="noscript-message">JavaScript is required to load live Company Intelligence.</p>
    </noscript>
  </main>

  <footer class="site-footer company-footer">
    <span>smallcaps.ai</span>
    <p>Current position. What matters now. Source-linked evidence.</p>
    <a class="company-footer-link" href="/rns">Company News ↗</a>
  </footer>
</body>
</html>

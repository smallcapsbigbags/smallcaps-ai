<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AIM company news. Facts. No fluff.">
  <meta name="theme-color" content="#f5f6f8">
  <title>Smallcaps.ai · AIM company news</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/research.css">
  <link rel="stylesheet" href="/assets/company.css">
  <link rel="stylesheet" href="/assets/company-polish.css">
  <link rel="stylesheet" href="/assets/news.css">
  <script src="/assets/research.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#monitoring-sheet">Skip to company news</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="/" aria-label="Smallcaps.ai home">
        <span>smallcaps</span><strong>.ai</strong>
      </a>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a class="nav-link nav-link-active" href="/rns" aria-current="page">News</a>
        <a class="nav-link" href="/">The AIM Daily</a>
      </nav>
      <div class="header-meta">
        <span class="live-status"><i aria-hidden="true"></i><span>AIM live</span></span>
        <form action="/logout" method="post">
          <button class="text-action" type="submit">Sign out</button>
        </form>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="feed-heading" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">AIM COMPANY NEWS</p>
        <h1 id="page-title">Facts. No fluff.</h1>
        <p class="feed-tagline">Every material AIM announcement, reduced to what changed.</p>
      </div>
      <div class="market-day" aria-live="polite">
        <span>Market day</span>
        <strong id="active-day">—</strong>
      </div>
    </section>

    <section class="feed-toolbar" aria-label="Company news controls">
      <label class="search-control" for="search-filter">
        <span class="sr-only">Search</span>
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"></circle><path d="m13 13 4 4"></path></svg>
        <input id="search-filter" type="search" autocomplete="off" placeholder="Search ticker, company or announcement">
      </label>
      <button id="filters-toggle" class="toolbar-button" type="button" aria-expanded="false" aria-controls="filter-panel">
        Filters <span id="filter-count" class="filter-count" hidden>0</span>
      </button>
    </section>

    <section id="filter-panel" class="filter-panel" aria-label="Filters" hidden>
      <div class="filter-grid">
        <label class="filter-control">
          <span>Company</span>
          <select id="company-filter"><option value="">All companies</option></select>
        </label>
        <label class="filter-control">
          <span>News type</span>
          <select id="type-filter"><option value="">All types</option></select>
        </label>
        <label class="filter-control">
          <span>Signal</span>
          <select id="signal-filter">
            <option value="">All signals</option>
            <option value="GREEN">Positive</option>
            <option value="AMBER">Mixed</option>
            <option value="RED">Negative</option>
            <option value="NO COLOUR">Neutral</option>
          </select>
        </label>
        <label class="filter-control">
          <span>Materiality</span>
          <select id="impact-filter">
            <option value="0">Any</option>
            <option value="2">2+ / 5</option>
            <option value="3">3+ / 5</option>
            <option value="4">4+ / 5</option>
            <option value="5">5 / 5</option>
          </select>
        </label>
        <label class="filter-control">
          <span>Sort</span>
          <select id="sort-filter">
            <option value="latest">Newest first</option>
            <option value="impact">Highest materiality</option>
            <option value="company">Company A–Z</option>
          </select>
        </label>
        <button id="reset-filters" class="reset-button" type="button">Reset filters</button>
      </div>
    </section>

    <section class="feed-summary" aria-live="polite">
      <div>
        <strong id="feed-mode">Key News</strong>
        <span id="feed-count">Loading company news…</span>
      </div>
      <span id="result-status">Preparing feed…</span>
    </section>

    <section class="monitoring-sheet" id="monitoring-sheet" aria-label="AIM company news">
      <div id="sheet-rows" class="sheet-rows">
        <div class="loading-state" role="status">
          <span class="loading-line loading-line-wide"></span>
          <span class="loading-line"></span>
          <span class="loading-line"></span>
        </div>
      </div>
    </section>

    <div class="other-news-control">
      <button id="material-toggle" class="show-other-button" type="button" aria-pressed="false" hidden>
        Show other updates
      </button>
    </div>

    <nav class="pagination" aria-label="Company news pages" hidden>
      <button id="previous-page" type="button" disabled>← Previous</button>
      <span id="page-status">Page 1</span>
      <button id="next-page" type="button" disabled>Next →</button>
    </nav>

    <noscript>
      <p class="noscript-message">JavaScript is required to load live AIM company news.</p>
    </noscript>
  </main>

  <footer class="site-footer">
    <span>smallcaps.ai</span>
    <p>AIM company news. Facts. No fluff.</p>
  </footer>
</body>
</html>

<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>Smallcaps.ai · Private beta</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/research.css">
  <link rel="stylesheet" href="/assets/company-polish.css">
</head>
<body class="access-body">
  <header class="site-header access-header">
    <a class="wordmark" href="/" aria-label="Smallcaps.ai home">
      <span>smallcaps</span><strong>.ai</strong>
    </a>
    <span class="live-status">
      <i aria-hidden="true"></i>
      <span class="status-full">Private beta</span>
      <span class="status-compact">Beta</span>
    </span>
  </header>

  <main class="access-main">
    <section class="access-copy" aria-labelledby="access-title">
      <p class="eyebrow">AIM COMPANY NEWS</p>
      <h1 id="access-title">Facts<span aria-hidden="true">.</span><br>No fluff<span aria-hidden="true">.</span></h1>
      <p class="access-intro">Every material AIM announcement reduced to the facts, what changed and the evidence behind it.</p>
    </section>

    <section class="access-panel" aria-label="Private beta access">
      <div class="access-rule"></div>
      <p class="access-label">PRIVATE BETA ACCESS</p>
      <form action="/access" method="post">
        <input type="hidden" name="next" value="{{ACCESS_NEXT}}">
        <label for="access-code">ACCESS CODE</label>
        <input id="access-code" name="access_code" type="password" autocomplete="current-password" required autofocus>
        {{ACCESS_ERROR}}
        <button type="submit">ENTER SMALLCAPS.AI <span aria-hidden="true">→</span></button>
      </form>
      <p class="access-note">Smallcaps.ai is investment research, not personal investment advice.</p>
    </section>
  </main>
</body>
</html>

name: launch-repair-pass2

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-repair-pass2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light-editorial-system:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///data/launch-repair-pass2.db
      PRIVATE_BETA_MODE: "false"
      APP_BETA_PASSWORD: preview-access
      APP_ADMIN_PASSWORD: preview-admin
      MARKET_DATA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node --check frontend/assets/daily.js

      - name: Seed deterministic newsroom data
        run: |
          rm -f data/launch-repair-pass2.db
          python -m jobs.seed_launch_preview
          python -m jobs.seed_pass1_preview

      - name: Start product
        shell: bash
        run: |
          mkdir -p /tmp/launch-repair-pass2
          python -m uvicorn web_app:app --host 127.0.0.1 --port 8501 \
            > /tmp/launch-repair-pass2/web.log 2>&1 &
          echo $! > /tmp/launch-repair-pass2/web.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/api/v1/health >/dev/null \
              && curl --fail --silent 'http://127.0.0.1:8501/api/v1/aim-daily/newsroom?state=morning_note' >/tmp/launch-repair-pass2/newsroom.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/launch-repair-pass2/web.log
          exit 1

      - name: Validate shared light-shell asset contract
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          import requests

          base = 'http://127.0.0.1:8501'
          response = requests.get(base, timeout=10)
          response.raise_for_status()
          if response.headers.get('cache-control') != 'no-store':
              raise AssertionError(response.headers)
          if '<meta name="theme-color" content="#f5f6f8">' not in response.text:
              raise AssertionError('The AIM Daily is not using the light browser chrome')
          for asset in ('news.css', 'daily.css', 'daily-polish.css', 'daily.js'):
              if re.search(rf'/assets/{re.escape(asset)}\?v=[0-9a-f]{{12}}', response.text) is None:
                  raise AssertionError(f'{asset} is not content fingerprinted')

          css = Path('frontend/assets/daily.css').read_text(encoding='utf-8')
          for selector in ('.lead-layout', '.also-story', '.quick-list', '.rest-grid'):
              if selector not in css:
                  raise AssertionError(f'Missing Daily surface contract: {selector}')
          for retired in ('#03080d', '#46d7ff', 'rgb(3, 8, 13)'):
              if retired in css:
                  raise AssertionError(f'Retired dark-theme token remains: {retired}')
          PY

      - name: Audit desktop and mobile Daily journeys
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse

          from playwright.sync_api import expect, sync_playwright

          base = 'http://127.0.0.1:8501'
          out = Path('/tmp/launch-repair-pass2')

          def capture(page):
              failures = []
              requests_seen = []
              page.on('pageerror', lambda error: failures.append(f'pageerror: {error}'))
              page.on('console', lambda message: failures.append(f'console: {message.text}') if message.type == 'error' else None)
              page.on('request', lambda request: requests_seen.append(request.url))
              return failures, requests_seen

          def assert_clean(failures, label):
              if failures:
                  raise AssertionError(f'{label}: {failures}')

          def assert_no_overflow(page):
              dims = page.evaluate(
                  """
                  () => ({
                    client: document.documentElement.clientWidth,
                    scroll: document.documentElement.scrollWidth,
                    body: document.body.scrollWidth,
                  })
                  """
              )
              if dims['scroll'] > dims['client'] + 2 or dims['body'] > dims['client'] + 2:
                  raise AssertionError(f'Document clips horizontally: {dims}')

          def assert_no_duplicate_ids(page):
              duplicates = page.evaluate(
                  """
                  () => {
                    const counts = new Map();
                    document.querySelectorAll('[id]').forEach((node) => counts.set(node.id, (counts.get(node.id) || 0) + 1));
                    return [...counts.entries()].filter(([, count]) => count > 1);
                  }
                  """
              )
              if duplicates:
                  raise AssertionError(f'Duplicate DOM ids: {duplicates}')

          def rgb_tuple(value):
              raw = value.replace('rgba(', '').replace('rgb(', '').replace(')', '')
              return tuple(float(part.strip()) for part in raw.split(',')[:3])

          def luminance(rgb):
              channels = []
              for value in rgb:
                  channel = value / 255
                  channels.append(channel / 12.92 if channel <= .04045 else ((channel + .055) / 1.055) ** 2.4)
              return .2126 * channels[0] + .7152 * channels[1] + .0722 * channels[2]

          def contrast(foreground, background):
              high, low = sorted((luminance(rgb_tuple(foreground)), luminance(rgb_tuple(background))), reverse=True)
              return (high + .05) / (low + .05)

          def assert_nav(page):
              links = page.locator('nav[aria-label="Primary navigation"] a').evaluate_all(
                  "els => els.map(el => ({text: el.textContent.trim(), href: el.getAttribute('href')}))"
              )
              expected = [
                  {'text': 'News', 'href': '/rns'},
                  {'text': 'Watchlist', 'href': '/rns?watchlist=1'},
                  {'text': 'The AIM Daily', 'href': '/'},
              ]
              if links != expected:
                  raise AssertionError(f'Navigation is not the shared product header: {links}')

          def wait_daily(page):
              page.get_by_role('heading', name='THE AIM DAILY', exact=True).wait_for(timeout=30000)
              expect(page.locator('#edition-summary')).to_contain_text('full analyses', timeout=30000)
              page.locator('.lead-layout').wait_for(timeout=30000)

          with sync_playwright() as p:
              browser = p.chromium.launch()

              desktop = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = desktop.new_page()
              failures, requests_seen = capture(page)
              page.goto(base, wait_until='domcontentloaded')
              wait_daily(page)

              computed = page.evaluate(
                  """
                  () => {
                    const body = getComputedStyle(document.body);
                    const header = getComputedStyle(document.querySelector('.site-header'));
                    const title = getComputedStyle(document.querySelector('#daily-title'));
                    const accent = getComputedStyle(document.querySelector('#daily-title span'));
                    const summary = getComputedStyle(document.querySelector('.daily-summary-strip'));
                    const lead = getComputedStyle(document.querySelector('.lead-layout'));
                    const rest = getComputedStyle(document.querySelector('.rest-grid'));
                    const active = document.querySelector('.edition-switcher button[aria-pressed="true"]');
                    const activeStyle = getComputedStyle(active);
                    const main = document.querySelector('.daily-main').getBoundingClientRect();
                    const headerInner = document.querySelector('.header-inner').getBoundingClientRect();
                    return {
                      bodyBackground: body.backgroundColor,
                      bodyFont: body.fontFamily,
                      headerBackground: header.backgroundColor,
                      titleColour: title.color,
                      titleSize: parseFloat(title.fontSize),
                      accent: accent.color,
                      summaryBackground: summary.backgroundColor,
                      summaryRadius: summary.borderTopLeftRadius,
                      leadBackground: lead.backgroundColor,
                      leadRadius: lead.borderTopLeftRadius,
                      restBackground: rest.backgroundColor,
                      restRadius: rest.borderTopLeftRadius,
                      activeText: active.textContent.trim(),
                      activeBackground: activeStyle.backgroundColor,
                      activeColour: activeStyle.color,
                      activeHeight: active.getBoundingClientRect().height,
                      mainWidth: main.width,
                      headerWidth: headerInner.width,
                    };
                  }
                  """
              )

              if computed['bodyBackground'] != 'rgb(245, 246, 248)':
                  raise AssertionError(f'Daily page is not light: {computed}')
              if not computed['headerBackground'].startswith('rgba(255, 255, 255') and computed['headerBackground'] != 'rgb(255, 255, 255)':
                  raise AssertionError(f'Header is not the shared white shell: {computed}')
              if computed['accent'] != 'rgb(37, 99, 235)':
                  raise AssertionError(f'Daily accent is not product blue: {computed}')
              if not 50 <= computed['titleSize'] <= 80:
                  raise AssertionError(f'Daily masthead scale is outside the restrained product range: {computed}')
              if abs(computed['mainWidth'] - computed['headerWidth']) > 2 or not 1100 <= computed['mainWidth'] <= 1122:
                  raise AssertionError(f'Daily and header do not share the product grid: {computed}')
              for key in ('summaryBackground', 'leadBackground', 'restBackground'):
                  if computed[key] != 'rgb(255, 255, 255)':
                      raise AssertionError(f'{key} is not a white product surface: {computed}')
              if computed['summaryRadius'] != '10px' or computed['restRadius'] != '10px' or computed['leadRadius'] != '12px':
                  raise AssertionError(f'Daily card geometry is inconsistent: {computed}')
              if computed['activeText'] != '08:00 MORNING':
                  raise AssertionError(f'Default edition state drifted: {computed}')
              if computed['activeBackground'] != 'rgb(238, 244, 255)' or computed['activeColour'] != 'rgb(37, 99, 235)':
                  raise AssertionError(f'Edition selection does not use the blue product state: {computed}')
              if computed['activeHeight'] < 56:
                  raise AssertionError(f'Desktop edition target is too small: {computed}')
              if contrast(computed['titleColour'], computed['bodyBackground']) < 10:
                  raise AssertionError(f'Masthead contrast is insufficient: {computed}')
              if 'Inter' not in computed['bodyFont'] and 'Segoe UI' not in computed['bodyFont']:
                  raise AssertionError(f'Daily is not using the shared sans-serif stack: {computed}')

              assert_nav(page)
              assert_no_overflow(page)
              assert_no_duplicate_ids(page)
              if not any(urlparse(url).path.endswith('/assets/news.css') for url in requests_seen):
                  raise AssertionError('The Daily did not load the shared News design foundation')
              if not any('/api/v1/aim-daily/newsroom?state=morning_note' in url for url in requests_seen):
                  raise AssertionError('The Daily did not request the undated latest edition')
              if page.locator('#edition-summary').inner_text().strip().startswith('0 full analyses'):
                  raise AssertionError('The light Daily regressed to an empty current-day edition')

              close_button = page.get_by_role('button', name='16:35 CLOSE', exact=True)
              close_button.click()
              expect(close_button).to_have_attribute('aria-pressed', 'true')
              page.wait_for_url('**/?state=aim_close')
              expect(page.locator('#edition-label')).to_contain_text('AIM CLOSE')
              page.get_by_role('button', name='08:00 MORNING', exact=True).click()
              expect(page.get_by_role('button', name='08:00 MORNING', exact=True)).to_have_attribute('aria-pressed', 'true')

              assert_clean(failures, 'Desktop Daily')
              page.screenshot(path=out / '01-aim-daily-light-desktop.png', full_page=True)
              desktop.close()

              mobile = browser.new_context(viewport={'width': 390, 'height': 844}, device_scale_factor=1, is_mobile=True)
              page = mobile.new_page()
              failures, _requests_seen = capture(page)
              page.goto(base, wait_until='domcontentloaded')
              wait_daily(page)
              mobile_state = page.evaluate(
                  """
                  () => {
                    const buttons = [...document.querySelectorAll('.edition-switcher button')];
                    return {
                      bodyBackground: getComputedStyle(document.body).backgroundColor,
                      titleSize: parseFloat(getComputedStyle(document.querySelector('#daily-title')).fontSize),
                      buttonHeights: buttons.map(button => button.getBoundingClientRect().height),
                      leadColumns: getComputedStyle(document.querySelector('.lead-layout')).gridTemplateColumns,
                      sideColumns: getComputedStyle(document.querySelector('.lead-side')).gridTemplateColumns,
                      alsoColumns: getComputedStyle(document.querySelector('.also-grid')).gridTemplateColumns,
                      signOutDisplay: getComputedStyle(document.querySelector('.text-action')).display,
                      activeNavDisplay: getComputedStyle(document.querySelector('.nav-link-active')).display,
                    };
                  }
                  """
              )
              if mobile_state['bodyBackground'] != 'rgb(245, 246, 248)':
                  raise AssertionError(f'Mobile Daily is not light: {mobile_state}')
              if not 40 <= mobile_state['titleSize'] <= 51:
                  raise AssertionError(f'Mobile masthead is not restrained: {mobile_state}')
              if min(mobile_state['buttonHeights']) < 47.5:
                  raise AssertionError(f'Mobile edition controls are not 48px targets: {mobile_state}')
              for key in ('leadColumns', 'sideColumns', 'alsoColumns'):
                  if ' ' in mobile_state[key].strip():
                      raise AssertionError(f'Mobile editorial layout did not collapse: {mobile_state}')
              if mobile_state['signOutDisplay'] == 'none' or mobile_state['activeNavDisplay'] == 'none':
                  raise AssertionError(f'Mobile product navigation is incomplete: {mobile_state}')
              assert_nav(page)
              assert_no_overflow(page)
              assert_no_duplicate_ids(page)
              assert_clean(failures, 'Mobile Daily')
              page.screenshot(path=out / '02-aim-daily-light-mobile.png', full_page=True)
              mobile.close()
              browser.close()
          PY

      - name: Reject runtime failures
        run: |
          if grep -En 'Traceback \(most recent call last\)|Uncaught app exception|newsroom-api-error' /tmp/launch-repair-pass2/web.log; then
            cat /tmp/launch-repair-pass2/web.log
            exit 1
          fi

      - name: Upload Pass 2 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-repair-pass2-evidence
          path: /tmp/launch-repair-pass2
          if-no-files-found: error
          retention-days: 90

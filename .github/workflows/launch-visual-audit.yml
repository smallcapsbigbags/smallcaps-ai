name: launch-visual-audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///data/launch-preview.db
      PRIVATE_BETA_MODE: "true"
      APP_BETA_PASSWORD: preview-access
      APP_ADMIN_PASSWORD: preview-admin
      MARKET_DATA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Seed deterministic preview database
        run: |
          python -m jobs.seed_launch_preview
          python -m jobs.seed_pass1_preview

      - name: Start Streamlit preview
        shell: bash
        run: |
          mkdir -p /tmp/launch-screenshots
          streamlit run streamlit_app.py \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > /tmp/launch-screenshots/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/launch-screenshots/streamlit.log
          exit 1

      - name: Capture and validate desktop and mobile customer journeys
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path('/tmp/launch-screenshots')
          base = 'http://127.0.0.1:8501'
          feed_search_placeholder = 'Ticker, company or announcement'
          feed_filter_label = 'Date & filters · 21 Aug 2026'

          def wait_for_view(page, expected):
              page.wait_for_function(
                  """
                  (view) => new URLSearchParams(window.location.search).get('view') === view
                  """,
                  arg=expected,
                  timeout=30000,
              )
              page.wait_for_timeout(700)

          def wait_for_feed(page):
              page.get_by_role('heading', name='AIM Intelligence', exact=True).wait_for(timeout=30000)
              page.get_by_placeholder(feed_search_placeholder).wait_for(timeout=30000)
              page.get_by_text(
                  'Administration imminent; no shareholder return expected',
                  exact=True,
              ).wait_for(timeout=30000)
              page.get_by_text(feed_filter_label, exact=True).first.wait_for(timeout=30000)
              page.get_by_role('button', name='Read analysis →').first.wait_for(timeout=30000)
              page.wait_for_timeout(300)

          def unlock(page):
              page.goto(base, wait_until='domcontentloaded')
              page.get_by_text('Every AIM announcement.', exact=False).wait_for(timeout=30000)
              page.get_by_label('Private beta access code').fill('preview-access')
              page.get_by_role('button', name='UNLOCK PRIVATE BETA').click()
              wait_for_feed(page)

          def assert_page_at_top(page, top_control, *, max_y=240, max_scroll=32):
              page.wait_for_timeout(500)
              box = top_control.bounding_box()
              if box is None:
                  raise AssertionError('Expected top navigation control is not visible')
              positions = page.evaluate(
                  """
                  () => {
                    const scrollTop = (el) => el ? Number(el.scrollTop || 0) : 0;
                    return {
                      window: Number(window.scrollY || 0),
                      scrollingElement: scrollTop(document.scrollingElement),
                      documentElement: scrollTop(document.documentElement),
                      body: scrollTop(document.body),
                      appView: scrollTop(document.querySelector('[data-testid="stAppViewContainer"]')),
                      main: scrollTop(document.querySelector('[data-testid="stMain"]')),
                    };
                  }
                  """
              )
              largest = max(float(value or 0) for value in positions.values())
              if largest > max_scroll or box['y'] < 0 or box['y'] > max_y:
                  raise AssertionError(
                      'Internal navigation did not begin at the top: '
                      f'control_y={box["y"]}, scroll_positions={positions}'
                  )

          def assert_no_page_overflow(page):
              dimensions = page.evaluate(
                  """
                  () => {
                    const root = document.documentElement;
                    const app = document.querySelector('[data-testid="stAppViewContainer"]');
                    return {
                      documentClient: Number(root.clientWidth || 0),
                      documentScroll: Number(root.scrollWidth || 0),
                      appClient: Number(app ? app.clientWidth : 0),
                      appScroll: Number(app ? app.scrollWidth : 0),
                    };
                  }
                  """
              )
              if dimensions['documentScroll'] > dimensions['documentClient'] + 2:
                  raise AssertionError(f'Document clips horizontally: {dimensions}')
              if dimensions['appScroll'] > dimensions['appClient'] + 2:
                  raise AssertionError(f'App clips horizontally: {dimensions}')

          def assert_feed_contract(page):
              for label in ('CRITICAL · ADVERSE', 'HIGH · MIXED', 'HIGH · FAVOURABLE'):
                  page.get_by_text(label, exact=True).first.wait_for(timeout=30000)
              page.get_by_text('Routine announcements · 1', exact=True).wait_for(timeout=30000)
              page.get_by_text(
                  'Formal takeover interest emerges; terms remain unknown', exact=True
              ).wait_for(timeout=30000)
              page.get_by_text('Thesis broken.', exact=False).wait_for(timeout=30000)

              records = page.locator('article[data-feed-kind="material"]')
              if records.count() < 5:
                  raise AssertionError(
                      f'Expected at least five material preview records, got {records.count()}'
                  )
              combined = '\n'.join(records.all_inner_texts())
              for forbidden in (
                  'IMPACT HIGH', '· GREEN', '· RED', '\nOther\n',
                  'Previous / comparator:', 'Not disclosed in supplied prior context',
              ):
                  if forbidden in f'\n{combined}\n':
                      raise AssertionError(f'Feed still exposes deprecated copy: {forbidden}')
              headings = page.locator(
                  'article[data-feed-kind="material"] .sca-evidence-heading'
              )
              if headings.filter(has_text='Evidence from the RNS').count() < 5:
                  raise AssertionError('Material records do not use the final Evidence heading')

          def assert_note_contract(page):
              page.get_by_text(
                  'Administration imminent; no shareholder return expected',
                  exact=True,
              ).wait_for(timeout=30000)
              headings = [
                  page.get_by_text('What happened', exact=True),
                  page.get_by_text('Evidence from the RNS', exact=True),
                  page.get_by_text('Our view', exact=True),
                  page.get_by_text('What to watch', exact=True),
                  page.get_by_text('Supporting detail', exact=True),
              ]
              for heading in headings:
                  heading.wait_for(timeout=30000)
              boxes = [heading.bounding_box() for heading in headings]
              if any(box is None for box in boxes):
                  raise AssertionError('Analyst Note executive hierarchy is not fully visible')
              ys = [box['y'] for box in boxes if box is not None]
              if ys != sorted(ys):
                  raise AssertionError(f'Analyst Note hierarchy is out of order: {ys}')

              page.get_by_role('link', name='Original RNS ↗', exact=True).wait_for(timeout=30000)
              text = page.locator('[data-testid="stMain"]').inner_text()
              for forbidden in (
                  'No new supporting evidence identified.',
                  'No new challenge identified.',
                  'No genuine guidance change identified.',
                  'No specific watch item identified.',
                  'Market reaction will appear once',
              ):
                  if forbidden in text:
                      raise AssertionError(f'Analyst Note still exposes empty-state copy: {forbidden}')

          def assert_mobile_note_layout(page):
              assert_no_page_overflow(page)
              evidence_grid = page.locator('.sca-note-evidence-grid').first
              columns = evidence_grid.evaluate(
                  '(el) => getComputedStyle(el).gridTemplateColumns'
              )
              if ' ' in columns.strip():
                  raise AssertionError(
                      f'Analyst Note evidence did not collapse to one mobile column: {columns}'
                  )

          with sync_playwright() as p:
              browser = p.chromium.launch()

              desktop = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = desktop.new_page()
              page.goto(base, wait_until='domcontentloaded')
              page.get_by_text('Every AIM announcement.', exact=False).wait_for(timeout=30000)
              page.screenshot(path=out / '01-beta-desktop.png', full_page=True)
              page.get_by_label('Private beta access code').fill('preview-access')
              page.get_by_role('button', name='UNLOCK PRIVATE BETA').click()
              wait_for_feed(page)
              assert_feed_contract(page)
              assert_no_page_overflow(page)
              page.screenshot(path=out / '02-feed-desktop.png', full_page=True)

              springfield_record = page.locator(
                  'article[data-feed-kind="material"]'
              ).filter(has_text='Meaningful buyback authority could retire about 10% of shares')
              springfield_record.first.screenshot(path=out / '02b-feed-springfield-desktop.png')

              page.get_by_role('button', name='Read analysis →').first.click()
              wait_for_view(page, 'note')
              note_top = page.get_by_role('button', name='← Feed', exact=True)
              note_top.wait_for(timeout=30000)
              assert_page_at_top(page, note_top)
              assert_note_contract(page)
              assert_no_page_overflow(page)
              page.screenshot(path=out / '03-note-desktop.png', full_page=True)

              page.get_by_text('Full evidence & calculations', exact=True).click()
              table = page.locator('table.sca-table-responsive').first
              table.wait_for(timeout=30000)
              if table.evaluate('(el) => el.scrollWidth > el.clientWidth + 2'):
                  raise AssertionError('Expanded Analyst Note table clips horizontally on desktop')
              page.screenshot(path=out / '03b-note-depth-desktop.png', full_page=True)

              page.get_by_role('button', name='Company', exact=True).click()
              wait_for_view(page, 'company')
              company_heading = page.get_by_text('Company Intelligence', exact=True)
              company_heading.wait_for(timeout=30000)
              company_top = page.get_by_role('button', name='← Feed', exact=True)
              company_top.wait_for(timeout=30000)
              assert_page_at_top(page, company_top)
              page.screenshot(path=out / '04-company-desktop.png', full_page=True)
              desktop.close()

              mobile = browser.new_context(
                  viewport={'width': 390, 'height': 844},
                  device_scale_factor=1,
                  is_mobile=True,
              )
              page = mobile.new_page()
              unlock(page)
              assert_feed_contract(page)
              assert_no_page_overflow(page)
              page.screenshot(path=out / '05-feed-mobile.png', full_page=True)

              primary = page.get_by_role('button', name='Read analysis →').first
              primary.evaluate('(el) => el.scrollIntoView({block: "center"})')
              page.wait_for_timeout(250)
              primary_box = primary.bounding_box()
              if primary_box is None or primary_box['height'] < 43.5:
                  raise AssertionError(f'Primary mobile action is not a 44px target: {primary_box}')
              page.screenshot(path=out / '05b-feed-trellus-actions-mobile.png')

              primary.click()
              wait_for_view(page, 'note')
              note_top = page.get_by_role('button', name='← Feed', exact=True)
              note_top.wait_for(timeout=30000)
              assert_page_at_top(page, note_top, max_y=220)
              assert_note_contract(page)
              assert_mobile_note_layout(page)
              page.screenshot(path=out / '06-note-mobile.png', full_page=True)

              page.get_by_text('Full evidence & calculations', exact=True).click()
              table = page.locator('table.sca-table-responsive').first
              table.wait_for(timeout=30000)
              if table.evaluate('(el) => el.scrollWidth > el.clientWidth + 2'):
                  raise AssertionError('Expanded Analyst Note table clips horizontally on mobile')
              page.screenshot(path=out / '06b-note-depth-mobile.png', full_page=True)

              mobile.close()
              browser.close()
          PY

      - name: Reject deprecated Streamlit component calls
        run: |
          if grep -Fq 'st.components.v1.html' /tmp/launch-screenshots/streamlit.log; then
            cat /tmp/launch-screenshots/streamlit.log
            exit 1
          fi

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallcaps-launch-visual-audit
          path: /tmp/launch-screenshots
          if-no-files-found: error
          retention-days: 90

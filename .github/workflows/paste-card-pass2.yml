name: paste-card-pass2

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paste-card-pass2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  card-contract-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      PRIVATE_BETA_MODE: "false"
      PASTE_ANALYSIS_ENABLED: "false"
      AIM_DISCOVERY_MODE: disabled
      MARKET_DATA_ENABLED: "false"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Validate the card contract
        run: |
          node --check frontend/assets/analysis-card.js
          node --check frontend/assets/analyse.js
          python -m compileall -q product/paste.py product/paste_card.py analyst/paste_editorial.py jobs/check_paste_card.py jobs/check_paste_editorial.py
          pytest -q tests/test_paste_card.py tests/test_paste_mvp.py tests/test_paste_editorial.py
      - name: Start the actual app without a paid API key
        shell: bash
        run: |
          mkdir -p /tmp/paste-card-pass2
          git ls-tree -r HEAD > /tmp/paste-card-pass2/source-tree.txt
          python -m uvicorn web_app:app --host 127.0.0.1 --port 8501 > /tmp/paste-card-pass2/web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8501/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/paste-card-pass2/web.log
          exit 1
      - name: Test source-preserving cards at four viewport widths
        run: python -m jobs.check_paste_card --base http://127.0.0.1:8501 --output /tmp/paste-card-pass2/previews
      - name: Test 2B editorial cards and progressive disclosure
        run: python -m jobs.check_paste_editorial --base http://127.0.0.1:8501 --output /tmp/paste-card-pass2/editorial
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paste-card-pass2-evidence
          path: /tmp/paste-card-pass2
          if-no-files-found: warn
          retention-days: 30

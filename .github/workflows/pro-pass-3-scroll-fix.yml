name: pro-pass-3-scroll-fix

on:
  push:
    branches: ["launch/pro-pass-3"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/pro-pass-3
          fetch-depth: 0
      - name: Apply one-time launch navigation fix
        run: |
          python - <<'PY'
          from pathlib import Path

          common = Path('ui/common.py')
          text = common.read_text(encoding='utf-8')
          old = "def inject_styles() -> None:\n    st.markdown(APP_CSS, unsafe_allow_html=True)\n"
          new = "def inject_styles() -> None:\n    st.markdown(APP_CSS, unsafe_allow_html=True)\n    consume_scroll_to_top()\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('Could not find inject_styles launch patch point')
              text = text.replace(old, new, 1)
              common.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/pro-pass-3-scroll-fix.yml')
          if workflow.exists():
              workflow.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/common.py .github/workflows/pro-pass-3-scroll-fix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Reset scroll position on internal navigation"
          git push origin HEAD:launch/pro-pass-3

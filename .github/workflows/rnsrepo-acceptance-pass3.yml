name: rnsrepo-acceptance-pass3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rnsrepo-pass3-sources]') || contains(github.event.head_commit.message, '[rnsrepo-pass3-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: rnsrepo_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RNSREPO_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/rnsrepo_test
      RNSREPO_CORPUS_DIR: corpus-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch fixed public source snapshots (zero AI calls)
        run: python -m jobs.fetch_rnsrepo_corpus --output corpus-evidence
      - run: python -m pytest tests/rnsrepo -q --junitxml=corpus-evidence/focused.xml
      - run: python -m pytest tests -q --junitxml=corpus-evidence/full.xml
      - name: Preflight every full announcement without AI
        run: python -m jobs.evaluate_rnsrepo --models gpt-5-mini --sources corpus-evidence --output corpus-evidence/preflight.json
      - name: Archive the actual tested source
        if: always()
        run: |
          mkdir -p corpus-evidence
          git archive --format=tar.gz HEAD > corpus-evidence/source.tar.gz
          git rev-parse HEAD > corpus-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rnsrepo-pass3-sources
          path: corpus-evidence/
          retention-days: 7
  live:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[rnsrepo-pass3-live]')
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt && pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m jobs.check_rnsrepo_pass3_live --live --output live-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rnsrepo-pass3-live
          path: live-evidence/
          retention-days: 7

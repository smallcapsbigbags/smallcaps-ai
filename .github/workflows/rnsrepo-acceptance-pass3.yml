name: rnsrepo-acceptance-pass3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rnsrepo-pass3-sources]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch fixed public source snapshots (zero AI calls)
        run: python -m jobs.fetch_rnsrepo_corpus --output corpus-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rnsrepo-pass3-sources
          path: corpus-evidence/
          retention-days: 7

name: scbb-pass7-watchlist-audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scbb-pass7-watchlist-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///data/scbb-pass7-preview.db
      PRIVATE_BETA_MODE: "false"
      APP_BETA_PASSWORD: preview-access
      APP_ADMIN_PASSWORD: preview-admin
      MARKET_DATA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node --check frontend/assets/watchlist.js
          node --check frontend/assets/company-watchlist.js
          node --check frontend/assets/research.js
          node --check frontend/assets/product-shell.js
          node --check frontend/assets/company-repo-pass1.js

      - name: Seed deterministic Watchlist company news
        run: |
          rm -f data/scbb-pass7-preview.db
          python -m jobs.seed_launch_preview
          python -m jobs.seed_pass1_preview

      - name: Start combined product
        shell: bash
        run: |
          mkdir -p /tmp/scbb-pass7-audit
          python -m uvicorn web_app:app --host 127.0.0.1 --port 8501 \
            > /tmp/scbb-pass7-audit/web.log 2>&1 &
          echo $! > /tmp/scbb-pass7-web.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scbb-pass7-audit/web.log
          exit 1

      - name: Validate the persistent combined Watchlist
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          from playwright.sync_api import expect, sync_playwright

          out = Path('/tmp/scbb-pass7-audit')
          base = 'http://127.0.0.1:8501'
          gamma = 'gama-pass1-possible-offer'
          springfield = 'spr-preview-buyback'

          def no_overflow(page):
              dims = page.evaluate(
                  """
                  () => ({
                    client: document.documentElement.clientWidth,
                    scroll: document.documentElement.scrollWidth,
                    body: document.body.scrollWidth,
                  })
                  """
              )
              if dims['scroll'] > dims['client'] + 2 or dims['body'] > dims['client'] + 2:
                  raise AssertionError(f'Document clips horizontally: {dims}')

          def wait_watchlist(page):
              page.get_by_role('heading', name='Your companies.', exact=True).wait_for(timeout=30000)
              expect(page.locator('#page-eyebrow')).to_have_text('WATCHLIST')
              expect(page.locator('#feed-tagline')).to_have_text('What changed. What needs attention.')
              expect(page.locator('[data-product-nav="watchlist"]')).to_have_attribute('aria-current', 'page')
              expect(page.locator('[data-product-status]')).to_have_text('AIM live')
              expect(page.locator('[data-company-search-input]')).to_be_visible()
              links = page.locator('nav[aria-label="Primary navigation"] a').evaluate_all(
                  "els => els.map(el => el.getAttribute('href'))"
              )
              if links != ['/rns', '/rns?watchlist=1']:
                  raise AssertionError(f'Watchlist navigation is not minimal: {links}')

          def wait_href(page, anchor, needle):
              href = ''
              for _ in range(120):
                  href = anchor.get_attribute('href') or ''
                  if needle in href:
                      return href
                  page.wait_for_timeout(50)
              raise AssertionError(f'Link never gained {needle}: {href}')

          with sync_playwright() as p:
              browser = p.chromium.launch()

              desktop = browser.new_context(viewport={'width': 1440, 'height': 1000})
              desktop.add_init_script(
                  "localStorage.setItem('smallcaps-ai-watchlist-v1', JSON.stringify(['GAMA', 'SPR']));"
              )
              page = desktop.new_page()
              page.goto(f'{base}/rns?watchlist=1', wait_until='domcontentloaded')
              wait_watchlist(page)
              expect(page.locator('#feed-mode')).to_have_text('Watchlist')
              expect(page.locator('#watchlist-nav-count')).to_have_text('2')
              expect(page.locator('#result-status')).to_contain_text('2 companies')
              expect(page.locator('article.monitor-row')).to_have_count(3)

              gamma_row = page.locator(f'article.monitor-row[data-source-id="{gamma}"]')
              gamma_row.wait_for(timeout=30000)
              expect(gamma_row.locator('.price-line')).to_contain_text('PRE 969.5p')
              expect(gamma_row.locator('.price-line')).to_contain_text('DAY +7.3%')

              spr_row = page.locator(f'article.monitor-row[data-source-id="{springfield}"]')
              company_link = spr_row.locator('a.company-research-link')
              href = wait_href(page, company_link, 'from=watchlist')
              query = parse_qs(urlparse(href).query)
              if query.get('from') != ['watchlist'] or query.get('open') != [springfield]:
                  raise AssertionError(f'Watchlist company context is incomplete: {href}')

              gamma_row.locator('button.watch-toggle').click()
              expect(page.locator(f'article.monitor-row[data-source-id="{gamma}"]')).to_have_count(0)
              expect(page.locator('#watchlist-nav-count')).to_have_text('1')
              no_overflow(page)
              page.screenshot(path=out / '01-watchlist-desktop.png', full_page=True)

              company_link = page.locator(
                  f'article.monitor-row[data-source-id="{springfield}"] a.company-research-link'
              )
              wait_href(page, company_link, 'from=watchlist')
              company_link.click()
              page.get_by_role('heading', name='SPR', exact=True).wait_for(timeout=30000)
              expect(page.locator('[data-product-nav="watchlist"]')).to_have_attribute('aria-current', 'page')
              expect(page.locator('#company-context-link')).to_have_text('← Back to Watchlist')
              expect(page.locator('#company-context-link')).to_have_attribute(
                  'href', f'/rns?watchlist=1&open={springfield}'
              )
              page.get_by_role('link', name='Open in Watchlist →', exact=True).wait_for(timeout=30000)
              page.locator('#company-context-link').click()
              page.wait_for_url(f'{base}/rns?watchlist=1&open={springfield}', timeout=30000)
              wait_watchlist(page)
              expect(page.locator(f'article.monitor-row[data-source-id="{springfield}"] .row-toggle')).to_have_attribute('aria-expanded', 'true')
              desktop.close()

              empty = browser.new_context(viewport={'width': 900, 'height': 700})
              page = empty.new_page()
              page.goto(f'{base}/rns?watchlist=1', wait_until='domcontentloaded')
              wait_watchlist(page)
              page.get_by_role('heading', name='Your watchlist is empty.', exact=True).wait_for(timeout=30000)
              expect(page.get_by_role('link', name='Browse company news →', exact=True)).to_be_visible()
              expect(page.locator('#watchlist-nav-count')).to_be_hidden()
              empty.close()

              mobile = browser.new_context(
                  viewport={'width': 390, 'height': 844},
                  device_scale_factor=1,
                  is_mobile=True,
              )
              mobile.add_init_script(
                  "localStorage.setItem('smallcaps-ai-watchlist-v1', JSON.stringify(['GAMA', 'SPR']));"
              )
              page = mobile.new_page()
              page.goto(f'{base}/rns?watchlist=1', wait_until='domcontentloaded')
              wait_watchlist(page)
              page.locator('article.monitor-row').first.wait_for(timeout=30000)
              no_overflow(page)
              star_box = page.locator('button.watch-toggle').first.bounding_box()
              if not star_box or star_box['width'] < 40 or star_box['height'] < 40:
                  raise AssertionError(f'Mobile watch target is too small: {star_box}')
              header = page.evaluate(
                  """
                  () => {
                    const nav = document.querySelector('.primary-nav').getBoundingClientRect();
                    const search = document.querySelector('.company-search').getBoundingClientRect();
                    const signout = document.querySelector('.text-action').getBoundingClientRect();
                    return {navBottom: nav.bottom, navHeight: nav.height, searchTop: search.top, searchHeight: search.height, signoutHeight: signout.height};
                  }
                  """
              )
              if header['navHeight'] < 43.5 or header['signoutHeight'] < 43.5:
                  raise AssertionError(f'Mobile shared header targets are too small: {header}')
              if header['searchTop'] < header['navBottom'] - 1 or header['searchHeight'] < 43.5:
                  raise AssertionError(f'Mobile company search row failed: {header}')
              page.screenshot(path=out / '02-watchlist-mobile.png', full_page=True)
              mobile.close()
              browser.close()
          PY

      - name: Reject runtime failures
        run: |
          if grep -En 'Traceback \(most recent call last\)|Uncaught app exception|monitoring-api-error|company-api-error' /tmp/scbb-pass7-audit/web.log; then
            cat /tmp/scbb-pass7-audit/web.log
            exit 1
          fi

      - name: Upload Watchlist audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallcaps-pass7-watchlist-audit
          path: /tmp/scbb-pass7-audit
          if-no-files-found: error
          retention-days: 90

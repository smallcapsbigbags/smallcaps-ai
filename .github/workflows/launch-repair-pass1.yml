name: launch-repair-pass1

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-repair-pass1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-read-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///data/launch-repair-pass1.db
      PRIVATE_BETA_MODE: "false"
      APP_BETA_PASSWORD: preview-access
      APP_ADMIN_PASSWORD: preview-admin
      MARKET_DATA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node --check frontend/assets/research.js
          node --check frontend/assets/product-shell.js
          node --check frontend/assets/company-repo-pass1.js

      - name: Seed deterministic production-shaped data
        run: |
          rm -f data/launch-repair-pass1.db
          python -m jobs.seed_launch_preview
          python -m jobs.seed_pass1_preview

      - name: Start product
        shell: bash
        run: |
          mkdir -p /tmp/launch-repair-pass1
          python -m uvicorn web_app:app --host 127.0.0.1 --port 8501 \
            > /tmp/launch-repair-pass1/web.log 2>&1 &
          echo $! > /tmp/launch-repair-pass1/web.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/api/v1/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8501/rns >/dev/null \
              && curl --fail --silent http://127.0.0.1:8501/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/launch-repair-pass1/web.log
          exit 1

      - name: Validate Company News front door and asset contract
        run: |
          python - <<'PY'
          import re
          import requests

          base = 'http://127.0.0.1:8501'
          for route in ('/', '/rns'):
              response = requests.get(f'{base}{route}', timeout=10)
              response.raise_for_status()
              if response.headers.get('cache-control') != 'no-store':
                  raise AssertionError(response.headers)
              if 'AIM COMPANY NEWS' not in response.text or 'Facts. No fluff.' not in response.text:
                  raise AssertionError(f'{route} is not Company News')
              if 'The AIM Daily' in response.text or 'data-product-nav="daily"' in response.text:
                  raise AssertionError(f'{route} still exposes the retired Daily')
              for asset in ('research.js', 'watchlist.js', 'product-shell.js', 'company-repo-pass1.js'):
                  match = re.search(rf'/assets/{re.escape(asset)}\?v=([0-9a-f]{{12}})', response.text)
                  if match is None:
                      raise AssertionError(f'{route} does not pin {asset} to the deployment fingerprint')
                  asset_response = requests.get(f'{base}{match.group(0)}', timeout=10)
                  asset_response.raise_for_status()
                  if asset_response.headers.get('cache-control') != 'public, max-age=0, must-revalidate':
                      raise AssertionError(asset_response.headers)
          PY

      - name: Audit the actual Company News customer read path
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse

          from playwright.sync_api import expect, sync_playwright

          base = 'http://127.0.0.1:8501'
          out = Path('/tmp/launch-repair-pass1')

          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = context.new_page()
              failures = []
              requests_seen = []
              page.on('pageerror', lambda error: failures.append(f'pageerror: {error}'))
              page.on('console', lambda message: failures.append(f'console: {message.text}') if message.type == 'error' else None)
              page.on('request', lambda request: requests_seen.append(request.url))

              page.goto(base, wait_until='domcontentloaded')
              page.get_by_role('heading', name='Facts. No fluff.', exact=True).wait_for(timeout=30000)
              page.locator('article.monitor-row').first.wait_for(timeout=30000)
              expect(page.locator('.loading-state')).to_have_count(0)
              expect(page.locator('#feed-count')).not_to_contain_text('Loading', timeout=30000)
              expect(page.locator('#feed-tagline')).to_have_text('What changed across AIM.')
              if not any('/api/v1/monitoring?' in url for url in requests_seen):
                  raise AssertionError('Company News never requested its live read model')
              links = page.locator('nav[aria-label="Primary navigation"] a').evaluate_all(
                  "els => els.map(el => el.getAttribute('href'))"
              )
              if links != ['/rns', '/rns?watchlist=1']:
                  raise AssertionError(f'Navigation is not minimal: {links}')
              expect(page.locator('[data-company-search-input]')).to_be_visible()
              if failures:
                  raise AssertionError(failures)
              page.screenshot(path=out / '01-company-news-front-door.png', full_page=True)
              context.close()
              browser.close()
          PY

      - name: Reject runtime failures
        run: |
          if grep -En 'Traceback \(most recent call last\)|Uncaught app exception|monitoring-api-error' /tmp/launch-repair-pass1/web.log; then
            cat /tmp/launch-repair-pass1/web.log
            exit 1
          fi

      - name: Upload read-path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-repair-pass1-evidence
          path: /tmp/launch-repair-pass1
          if-no-files-found: error
          retention-days: 90

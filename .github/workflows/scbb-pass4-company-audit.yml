name: scbb-pass4-company-audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scbb-pass4-company-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  company-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///data/scbb-pass4-preview.db
      PRIVATE_BETA_MODE: "false"
      APP_BETA_PASSWORD: preview-access
      APP_ADMIN_PASSWORD: preview-admin
      MARKET_DATA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node --check frontend/assets/company.js
          node --check frontend/assets/product-shell.js

      - name: Enforce the Company Intelligence asset contract
        run: |
          grep -Fq '/assets/company-pass4.css?v={{ASSET_VERSION}}' frontend/company.html
          grep -Fq '/assets/product-shell.css?v={{ASSET_VERSION}}' frontend/company.html
          grep -Fq '/assets/company.js?v={{ASSET_VERSION}}' frontend/company.html
          grep -Fq '/assets/product-shell.js?v={{ASSET_VERSION}}' frontend/company.html
          for retired in research.css company.css company-polish.css company-launch.css company-journey.js company-launch.js; do
            if grep -Fq "/assets/$retired" frontend/company.html; then
              echo "Company Intelligence still loads retired asset: $retired"
              exit 1
            fi
          done
          ! grep -Fq 'innerHTML' frontend/assets/company.js

      - name: Seed deterministic company research
        run: |
          rm -f data/scbb-pass4-preview.db
          python -m jobs.seed_launch_preview
          python -m jobs.seed_pass1_preview

      - name: Start combined product
        shell: bash
        run: |
          mkdir -p /tmp/scbb-pass4-audit
          python -m uvicorn web_app:app --host 127.0.0.1 --port 8501 \
            > /tmp/scbb-pass4-audit/web.log 2>&1 &
          echo $! > /tmp/scbb-pass4-web.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/api/v1/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8501/api/v1/company/SPR >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scbb-pass4-audit/web.log
          exit 1

      - name: Audit Company Intelligence on desktop and mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          from playwright.sync_api import expect, sync_playwright

          out = Path('/tmp/scbb-pass4-audit')
          base = 'http://127.0.0.1:8501'

          def no_overflow(page):
              dims = page.evaluate(
                  """
                  () => ({
                    client: document.documentElement.clientWidth,
                    scroll: document.documentElement.scrollWidth,
                    body: document.body.scrollWidth,
                    duplicates: [...document.querySelectorAll('[id]')]
                      .map(node => node.id)
                      .filter((id, index, values) => values.indexOf(id) !== index),
                  })
                  """
              )
              if dims['scroll'] > dims['client'] + 2 or dims['body'] > dims['client'] + 2:
                  raise AssertionError(f'Document clips horizontally: {dims}')
              if dims['duplicates']:
                  raise AssertionError(f'Duplicate ids: {dims}')

          def wait_company(page, ticker):
              page.get_by_role('heading', name=ticker, exact=True).wait_for(timeout=30000)
              current = page.locator('[data-company-section="current-position"]')
              current.wait_for(timeout=30000)
              page.get_by_role('heading', name='Current position', exact=True).wait_for(timeout=30000)
              page.get_by_role('heading', name='Evidence trail', exact=True).wait_for(timeout=30000)
              return current

          def assert_company(page, ticker, sparse=False):
              current = wait_company(page, ticker)
              current.get_by_text('What changed', exact=True).wait_for(timeout=30000)
              current.get_by_text('Smallcaps.ai view', exact=True).wait_for(timeout=30000)
              current.get_by_text('Guidance', exact=True).wait_for(timeout=30000)
              current.get_by_text('Balance sheet', exact=True).wait_for(timeout=30000)
              current.get_by_text('Market reaction', exact=True).wait_for(timeout=30000)
              current.get_by_text('Materiality', exact=True).wait_for(timeout=30000)
              current.get_by_role('link', name='Source RNS ↗', exact=True).wait_for(timeout=30000)
              current.get_by_role('link', name='Open in News →', exact=True).wait_for(timeout=30000)
              expect(page.locator('[data-product-nav="news"]')).to_have_attribute('aria-current', 'page')
              expect(page.locator('[data-product-status]')).to_have_text('AIM live')

              words = current.locator('.company-view-copy p').inner_text().strip().split()
              if not words or len(words) > 50:
                  raise AssertionError(f'Company view is not terse: {len(words)} words')

              keys = page.locator('.company-section').evaluate_all(
                  "els => els.map(el => el.dataset.companySection)"
              )
              if not keys or keys[0] != 'current-position' or keys[-1] != 'evidence-trail':
                  raise AssertionError(f'Company hierarchy drifted: {keys}')
              if sparse and 'what-matters' in keys:
                  raise AssertionError(f'Sparse research invented a section: {keys}')
              if not sparse and 'what-matters' not in keys:
                  raise AssertionError(f'Established research lost What matters now: {keys}')

              body_lines = {
                  line.strip().upper()
                  for line in page.locator('body').inner_text().splitlines()
                  if line.strip()
              }
              for retired in (
                  'LATEST COMPANY NEWS',
                  'AI VIEW',
                  'RNS HISTORY',
                  'COMPANY MONITORING SHEET',
                  'VIEW FULL ANALYST NOTE',
                  'READ ANALYSIS →',
              ):
                  if retired in body_lines:
                      raise AssertionError(f'Legacy copy remains visible: {retired}')
              if page.locator('.company-data-row, .company-history-row').count():
                  raise AssertionError('Retired database-table layout remains visible')
              no_overflow(page)
              return current

          with sync_playwright() as p:
              browser = p.chromium.launch()

              desktop = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = desktop.new_page()
              page.goto(
                  f'{base}/company/SPR?from=news&date=2026-08-21&open=spr-preview-buyback',
                  wait_until='domcontentloaded',
              )
              current = assert_company(page, 'SPR')
              expect(page.locator('#company-context-link')).to_have_attribute(
                  'href', '/rns?date=2026-08-21&open=spr-preview-buyback'
              )
              expect(page.locator('#company-context-link')).to_have_text('← Back to Company News')
              if page.locator('[data-matter-card="metrics"] .company-matter-row').count() < 3:
                  raise AssertionError('Springfield lost decision-useful metrics')
              if page.locator('.company-event').count() != 2:
                  raise AssertionError('Springfield evidence trail is incomplete')

              computed = page.evaluate(
                  """
                  () => ({
                    background: getComputedStyle(document.body).backgroundColor,
                    surface: getComputedStyle(document.querySelector('.company-position-card')).backgroundColor,
                    headingSize: parseFloat(getComputedStyle(document.querySelector('.company-hero h1')).fontSize),
                    accent: getComputedStyle(document.querySelector('.company-hero h1 em')).color,
                    columns: getComputedStyle(document.querySelector('.company-position-main')).gridTemplateColumns,
                  })
                  """
              )
              if computed['background'] != 'rgb(245, 246, 248)' or computed['surface'] != 'rgb(255, 255, 255)':
                  raise AssertionError(f'Company visual system drifted: {computed}')
              if computed['accent'] != 'rgb(37, 99, 235)' or not 42 <= computed['headingSize'] <= 72:
                  raise AssertionError(f'Company hierarchy drifted: {computed}')
              if len(computed['columns'].split()) < 2:
                  raise AssertionError(f'Desktop decision surface did not retain two columns: {computed}')

              current.locator('.company-current-evidence > summary').click()
              page.get_by_role('heading', name='Reported facts', exact=True).wait_for(timeout=30000)
              page.get_by_role('heading', name='Before → now', exact=True).wait_for(timeout=30000)
              page.get_by_role(
                  'heading', name='Not disclosed / source checks', exact=True
              ).wait_for(timeout=30000)
              page.screenshot(path=out / '01-company-springfield-desktop.png', full_page=True)
              desktop.close()

              sparse = browser.new_context(viewport={'width': 1280, 'height': 900})
              page = sparse.new_page()
              page.goto(f'{base}/company/TRLS', wait_until='domcontentloaded')
              assert_company(page, 'TRLS', sparse=True)
              page.get_by_text(
                  'Administration imminent; no shareholder return expected', exact=True
              ).first.wait_for(timeout=30000)
              if page.locator('.company-event').count() != 1:
                  raise AssertionError('Trellus evidence trail should contain one event')
              page.screenshot(path=out / '02-company-trellus-laptop.png', full_page=True)
              sparse.close()

              mobile = browser.new_context(
                  viewport={'width': 390, 'height': 844},
                  device_scale_factor=1,
                  is_mobile=True,
              )
              page = mobile.new_page()
              page.goto(f'{base}/company/SPR', wait_until='domcontentloaded')
              assert_company(page, 'SPR')
              layout = page.evaluate(
                  """
                  () => ({
                    current: getComputedStyle(document.querySelector('.company-position-main')).gridTemplateColumns,
                    matters: getComputedStyle(document.querySelector('.company-matters-grid')).gridTemplateColumns,
                    nav: document.querySelector('.primary-nav').getBoundingClientRect().height,
                    signout: document.querySelector('.text-action').getBoundingClientRect().height,
                  })
                  """
              )
              if len(layout['current'].split()) != 1 or len(layout['matters'].split()) != 1:
                  raise AssertionError(f'Mobile company grids did not collapse: {layout}')
              if layout['nav'] < 43.5 or layout['signout'] < 43.5:
                  raise AssertionError(f'Mobile shell targets are too small: {layout}')
              for selector in (
                  '#company-watch-toggle',
                  '.company-action',
                  '.company-current-evidence > summary',
              ):
                  box = page.locator(selector).first.bounding_box()
                  if box is None or box['height'] < 43.5:
                      raise AssertionError(f'Mobile target is too small: {selector} {box}')
              page.screenshot(path=out / '03-company-springfield-mobile.png', full_page=True)
              mobile.close()
              browser.close()
          PY

      - name: Reject runtime failures
        run: |
          if grep -En 'Traceback \(most recent call last\)|Uncaught app exception|company-api-error|monitoring-api-error' /tmp/scbb-pass4-audit/web.log; then
            cat /tmp/scbb-pass4-audit/web.log
            exit 1
          fi

      - name: Upload Company Intelligence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallcaps-company-intelligence-audit
          path: /tmp/scbb-pass4-audit
          if-no-files-found: error
          retention-days: 90

name: scbb-pass4-company-audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scbb-pass4-company-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  company-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///data/scbb-pass4-preview.db
      PRIVATE_BETA_MODE: "false"
      APP_BETA_PASSWORD: preview-access
      APP_ADMIN_PASSWORD: preview-admin
      MARKET_DATA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node --check frontend/assets/company.js
          node --check frontend/assets/company-journey.js
          node --check frontend/assets/company-launch.js

      - name: Seed deterministic company research
        run: |
          rm -f data/scbb-pass4-preview.db
          python -m jobs.seed_launch_preview
          python -m jobs.seed_pass1_preview

      - name: Start combined product
        shell: bash
        run: |
          mkdir -p /tmp/scbb-pass4-audit
          python -m uvicorn web_app:app --host 127.0.0.1 --port 8501 \
            > /tmp/scbb-pass4-audit/web.log 2>&1 &
          echo $! > /tmp/scbb-pass4-web.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/api/v1/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8501/api/v1/company/SPR >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scbb-pass4-audit/web.log
          exit 1

      - name: Capture and validate Company Intelligence journey
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import expect, sync_playwright

          out = Path('/tmp/scbb-pass4-audit')
          base = 'http://127.0.0.1:8501'

          def no_overflow(page):
              dims = page.evaluate(
                  """
                  () => ({
                    client: document.documentElement.clientWidth,
                    scroll: document.documentElement.scrollWidth,
                    body: document.body.scrollWidth,
                  })
                  """
              )
              if dims['scroll'] > dims['client'] + 2 or dims['body'] > dims['client'] + 2:
                  raise AssertionError(f'Document clips horizontally: {dims}')

          def wait_company(page, ticker):
              page.get_by_role('heading', name=ticker, exact=True).wait_for(timeout=30000)
              page.locator('[data-company-section="current-view"]').wait_for(timeout=30000)
              page.get_by_text('LATEST COMPANY NEWS', exact=True).wait_for(timeout=30000)
              page.wait_for_timeout(250)

          def assert_no_legacy_language(page):
              body = page.locator('body').inner_text()
              for retired in (
                  'AI VIEW',
                  'RNS HISTORY',
                  'COMPANY MONITORING SHEET',
                  'VIEW FULL ANALYST NOTE',
                  'READ ANALYSIS →',
                  'ORIGINAL RNS ↗',
                  'OPEN IN RNS FEED →',
              ):
                  if retired in body:
                      raise AssertionError(f'Legacy company language is still visible: {retired}')

          def assert_springfield(page):
              wait_company(page, 'SPR')
              page.get_by_text('Springfield Properties plc', exact=True).first.wait_for(timeout=30000)
              page.get_by_text('Meaningful buyback authority could retire about 10% of shares', exact=True).first.wait_for(timeout=30000)
              for section in (
                  'LATEST COMPANY NEWS',
                  'GUIDANCE',
                  'METRICS THAT MATTER',
                  'MANAGEMENT COMMITMENTS',
                  'WHAT REMAINS UNCLEAR',
                  'COMPANY NEWS HISTORY',
              ):
                  page.get_by_text(section, exact=True).first.wait_for(timeout=30000)
              if page.locator('[data-company-section="metrics"] .company-data-row').count() < 3:
                  raise AssertionError('Springfield should expose at least three decision-useful metrics')
              if page.locator('.company-history-row').count() != 2:
                  raise AssertionError('Springfield should show both preview announcements')

              expect(page.locator('.company-current-change')).to_have_attribute('data-label', 'WHAT CHANGED')
              expect(page.locator('.company-ai-view span')).to_have_text('TAKE')
              take = page.locator('.company-ai-view p').inner_text().strip().split()
              if not take or len(take) > 45:
                  raise AssertionError(f'Company take should be terse and non-empty: {len(take)} words')

              page.get_by_text('VIEW EVIDENCE', exact=True).click()
              page.get_by_text('TAKE', exact=True).first.wait_for(timeout=30000)
              page.get_by_text('MATERIAL FACTS', exact=True).first.wait_for(timeout=30000)
              page.get_by_text('WHAT CHANGED', exact=True).first.wait_for(timeout=30000)
              for retired in ('AI VIEW', 'WHAT TO WATCH', 'SUPPORTS THE CASE', 'CHALLENGES THE CASE', 'READ-THROUGH'):
                  expect(page.get_by_text(retired, exact=True)).to_have_count(0)

              first_history = page.locator('.company-history-row').first
              first_history.get_by_role('button', name='VIEW EVIDENCE →', exact=True).click()
              first_history.get_by_text('WHAT CHANGED', exact=True).first.wait_for(timeout=30000)
              first_history.get_by_role('link', name='SOURCE ↗', exact=True).wait_for(timeout=30000)
              assert_no_legacy_language(page)

          def assert_trellus(page):
              wait_company(page, 'TRLS')
              page.get_by_text('Administration imminent; no shareholder return expected', exact=True).first.wait_for(timeout=30000)
              page.get_by_text('Negative', exact=True).first.wait_for(timeout=30000)
              page.get_by_text('5/5 · VERY HIGH', exact=True).first.wait_for(timeout=30000)
              for key in ('guidance', 'metrics', 'promises'):
                  if page.locator(f'[data-company-section="{key}"]').count():
                      raise AssertionError(f'Sparse Trellus research invented a {key} section')
              if page.locator('.company-history-row').count() != 1:
                  raise AssertionError('Trellus should have one preview history row')
              assert_no_legacy_language(page)

          with sync_playwright() as p:
              browser = p.chromium.launch()

              desktop = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = desktop.new_page()
              page.goto(f'{base}/rns', wait_until='domcontentloaded')
              page.get_by_role('heading', name='Facts. No fluff.', exact=True).wait_for(timeout=30000)
              company_link = page.locator('a.company-research-link[href="/company/SPR"]').first
              company_link.wait_for(timeout=30000)
              company_link.click()
              assert_springfield(page)
              no_overflow(page)
              computed = page.evaluate(
                  """
                  () => ({
                    background: getComputedStyle(document.body).backgroundColor,
                    headingSize: parseFloat(getComputedStyle(document.querySelector('.company-hero h1')).fontSize),
                    accent: getComputedStyle(document.querySelector('.company-hero h1 em')).color,
                    surface: getComputedStyle(document.querySelector('.company-section')).backgroundColor,
                  })
                  """
              )
              if computed['background'] != 'rgb(245, 246, 248)':
                  raise AssertionError(f'Company page should use the Facts No Fluff page background: {computed}')
              if computed['surface'] != 'rgb(255, 255, 255)':
                  raise AssertionError(f'Company sections should use white surfaces: {computed}')
              if not 40 <= computed['headingSize'] <= 70:
                  raise AssertionError(f'Company ticker hierarchy is no longer compact: {computed}')
              if computed['accent'] != 'rgb(37, 99, 235)':
                  raise AssertionError(f'Company page should use Smallcaps.ai blue: {computed}')
              watch_box = page.locator('#company-watch-toggle').bounding_box()
              if watch_box is None or watch_box['height'] < 43.5:
                  raise AssertionError(f'Watch target is too small: {watch_box}')
              page.screenshot(path=out / '01-company-springfield-desktop.png', full_page=True)
              desktop.close()

              sparse = browser.new_context(viewport={'width': 1280, 'height': 900})
              page = sparse.new_page()
              page.goto(f'{base}/company/TRLS', wait_until='domcontentloaded')
              assert_trellus(page)
              no_overflow(page)
              page.screenshot(path=out / '02-company-trellus-laptop.png', full_page=True)
              sparse.close()

              mobile = browser.new_context(
                  viewport={'width': 390, 'height': 844},
                  device_scale_factor=1,
                  is_mobile=True,
              )
              page = mobile.new_page()
              page.goto(f'{base}/company/SPR', wait_until='domcontentloaded')
              assert_springfield(page)
              no_overflow(page)
              row = page.locator('.company-data-row').first
              columns = row.evaluate('(el) => getComputedStyle(el).gridTemplateColumns')
              if ' ' in columns.strip():
                  raise AssertionError(f'Mobile company table did not collapse to one column: {columns}')
              action = page.get_by_role('button', name='VIEW EVIDENCE →', exact=True).first
              box = action.bounding_box()
              if box is None or box['height'] < 43.5:
                  raise AssertionError(f'Mobile evidence action is too small: {box}')
              page.screenshot(path=out / '03-company-springfield-mobile.png', full_page=True)
              mobile.close()

              browser.close()
          PY

      - name: Reject runtime and frontend failures
        run: |
          if grep -En 'Traceback \(most recent call last\)|Uncaught app exception|company-api-error|monitoring-api-error' /tmp/scbb-pass4-audit/web.log; then
            cat /tmp/scbb-pass4-audit/web.log
            exit 1
          fi

      - name: Upload Company Intelligence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallcaps-company-intelligence-audit
          path: /tmp/scbb-pass4-audit
          if-no-files-found: error
          retention-days: 90

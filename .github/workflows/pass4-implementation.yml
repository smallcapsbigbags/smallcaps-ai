          new_doc = '''    """LSE.co.uk AIM discovery with FCA NSM reconciliation.\n\n    The dedicated LSE.co.uk AIM RNS catalogue is the live discovery authority.\n    FCA NSM is queried once per target day to corroborate exact announcements and\n    can recover records for already-known AIM companies if both live catalogues\n    fail. Investegate is retained as an emergency catalogue fallback and a second\n    discovery cross-check, never as a reason to widen a healthy LSE AIM feed.\n    """'''
          text = text.replace(old_doc, new_doc)
          text = text.replace(

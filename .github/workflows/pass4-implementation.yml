          text = text.replace(old_sig, new_sig)

          start = text.index("    def list_announcements(\n")
          end = text.index("    def prepare_documents(\n", start)
          replacement = r'''    def _all_known_companies(self) -> dict[str, tuple[str, str]]:
        if self.repository is None:
            return {}
        with session_scope(self.repository.session_factory) as session:
            rows = session.execute(
                select(CompanyRow.ticker, CompanyRow.company_name)
            ).all()
        output: dict[str, tuple[str, str]] = {}
        for ticker, company_name in rows:
            key = company_key(company_name)
            if key:
                output.setdefault(key, (str(ticker).upper(), _clean(company_name)))
        return output

    def _append_url(self, source_id: str, source_url: str) -> None:
        url = _clean(source_url)
        if not url:
            return
        self._urls[source_id] = list(
            dict.fromkeys([*self._urls.get(source_id, []), url])
        )

    def _load_fca_records(
        self,
        day: date,
        warnings: list[str],
    ) -> list[FcaNsmRecord]:
        if not self.enable_fca_reconciliation:
            return []
        try:
            return self.fca_client.list_rns(day)
        except Exception as exc:
            warnings.append(
                "FCA NSM reconciliation unavailable; live catalogue ingestion "
                f"continues without verification. {type(exc).__name__}: {str(exc)[:300]}"
            )
            return []

    def _reconcile_fca(
        self,
        items: list[CatalogueAnnouncement],
        records: list[FcaNsmRecord],
        warnings: list[str],
    ) -> None:
        if not items or not records:
            return
        known_names = self._known_company_names({item.ticker.upper() for item in items})
        confirmed = 0
        for item in items:
            company = known_names.get(item.ticker.upper(), item.company)
            match = match_nsm_record(
                headline=item.title,
                published_at=item.published_at,
                company=company if company != item.ticker else "",
                records=records,
            )
            if match is None:
                continue
            confirmed += 1
            self._append_url(item.source_id, match.source_url)
            note_parts = [f"FCA NSM confirmed {match.disclosure_id}"]
            if match.lei:
                note_parts.append(f"LEI {match.lei}")
            prior = _clean(self._notes.get(item.source_id, ""))
            note = "; ".join(note_parts) + "."
            self._notes[item.source_id] = " ".join(part for part in (prior, note) if part)
        warnings.append(
            "FCA NSM reconciliation: "
            f"confirmed={confirmed}, awaiting_or_unmatched={len(items) - confirmed}. "
            "NSM confirmation is delayed and is not required for live publication."
        )

    def _fca_known_company_fallback(
        self,
        records: list[FcaNsmRecord],
    ) -> list[CatalogueAnnouncement]:
        known = self._all_known_companies()
        if not known:
            return []
        output: dict[str, CatalogueAnnouncement] = {}
        for record in records:
            company_match = known.get(company_key(record.company))
            if company_match is None:
                continue
            ticker, company_name = company_match
            published_at = record.published_at.astimezone(LONDON)
            key = _announcement_key(
                ticker=ticker,
                published_at=published_at,
                headline=record.headline,
            )
            source_id = "aim-fca-" + hashlib.sha256(
                record.disclosure_id.encode()
            ).hexdigest()[:20]
            output[key] = CatalogueAnnouncement(
                source_id=source_id,
                ticker=ticker,
                company=company_name,
                published_at=published_at,
                title=record.headline,
                source_url=record.source_url,
            )
            self._append_url(source_id, record.source_url)
            note = f"FCA NSM fallback record {record.disclosure_id}."
            if record.lei:
                note += f" LEI {record.lei}."
            self._notes[source_id] = note
        return sorted(output.values(), key=lambda item: item.published_at)

    def list_announcements(
        self, day: date
    ) -> tuple[list[CatalogueAnnouncement], list[str]]:
        self._evidence, self._urls, self._notes = {}, {}, {}
        self._resolved_companies = {}
        warnings: list[str] = []

        lse_items: list[CatalogueAnnouncement] = []
        lse_error = ""
        try:
            lse_items = self._list_lse(day)
        except Exception as exc:
            lse_error = f"{type(exc).__name__}: {exc}"

        investegate_items: list[CatalogueAnnouncement] = []
        investegate_error = ""
        try:
            investegate_items, investegate_warnings = super().list_announcements(day)
            warnings.extend(
                warning
                for warning in investegate_warnings
                if warning.startswith("Investegate returned no AIM rows")
            )
        except Exception as exc:
            investegate_error = f"{type(exc).__name__}: {exc}"
            # The superclass may have partially populated evidence dictionaries.
            self._evidence, self._urls, self._notes = {}, {}, {}

        fca_records = self._load_fca_records(day, warnings)

        # Normal path: the dedicated LSE.co.uk AIM page defines the live universe.
        # A matching Investegate row may preserve the established source identity,
        # but Investegate-only rows do not widen a healthy LSE AIM catalogue.
        if lse_items:
            investegate_by_key = {
                self._catalogue_key(item): item for item in investegate_items
            }
            canonical: list[CatalogueAnnouncement] = []
            matched = 0
            for lse_item in lse_items:
                key = self._catalogue_key(lse_item)
                secondary = investegate_by_key.get(key)
                if secondary is not None:
                    matched += 1
                    item = lse_item.model_copy(
                        update={
                            "source_id": secondary.source_id,
                            "company": secondary.company or lse_item.company,
                            "source_url": lse_item.source_url,
                        }
                    )
                    self._append_url(item.source_id, secondary.source_url)
                else:
                    item = lse_item
                self._append_url(item.source_id, lse_item.source_url)
                canonical.append(item)

            lse_keys = {self._catalogue_key(item) for item in lse_items}
            investegate_keys = {
                self._catalogue_key(item) for item in investegate_items
            }
            investegate_only = len(investegate_keys - lse_keys)
            if investegate_error:
                warnings.append(
                    "Investegate cross-check unavailable; LSE.co.uk AIM discovery "
                    "remains active. " + investegate_error[:350]
                )
            else:
                warnings.append(
                    "LSE.co.uk AIM discovery: "
                    f"accepted={len(lse_items)}, Investegate matched={matched}, "
                    f"Investegate-only held out={investegate_only}."
                )

            items = self._reuse_existing_source_ids(
                sorted(canonical, key=lambda item: item.published_at)
            )
            self._reconcile_fca(items, fca_records, warnings)
            return items, warnings

        # First fallback: Investegate keeps the full live AIM feed operating if the
        # LSE catalogue is unavailable or unexpectedly empty.
        if investegate_items:
            if lse_error:
                warnings.append(
                    "LSE.co.uk AIM discovery unavailable; Investegate is being used "
                    "as the emergency live catalogue. " + lse_error[:350]
                )
            else:
                warnings.append(
                    "LSE.co.uk returned no target-day AIM RNS rows; Investegate is "
                    "being used as the emergency live catalogue."
                )
            items = self._reuse_existing_source_ids(
                sorted(investegate_items, key=lambda item: item.published_at)
            )
            self._reconcile_fca(items, fca_records, warnings)
            return items, warnings

        # Last fallback: NSM can recover exact records only for companies already in
        # the AIM company repository. It must never be treated as the full AIM market.
        fca_items = self._fca_known_company_fallback(fca_records)
        if fca_items:
            warnings.append(
                "Both live AIM catalogues returned no rows; FCA NSM recovered "
                f"{len(fca_items)} announcement(s) for already-known AIM companies. "
                "This fallback is deliberately not a complete market catalogue."
            )
            return self._reuse_existing_source_ids(fca_items), warnings

        if lse_error and investegate_error:
            raise RuntimeError(
                "All live AIM catalogue sources failed and FCA NSM could not recover "
                "a known-company record. "
                f"LSE.co.uk={lse_error}; Investegate={investegate_error}"
            )
        if lse_error:
            warnings.append("LSE.co.uk failed and no fallback catalogue returned target-day rows.")
        if investegate_error:
            warnings.append("Investegate failed and no fallback catalogue returned target-day rows.")
        return [], warnings

'''

          docs = r'''# Company repository source architecture

## Operational hierarchy

1. **LSE.co.uk AIM RNS catalogue — live discovery.** The dedicated AIM page defines the live announcement set. Only rows explicitly labelled `RNS` are accepted.
2. **FCA National Storage Mechanism — verification and delayed reconciliation.** Exact headline/date/company matches add the FCA artefact URL and disclosure identifier to the source record.
3. **Investegate — emergency live-catalogue fallback and corroboration.** It keeps the feed operating if LSE.co.uk is unavailable. Investegate-only rows never widen a healthy LSE AIM catalogue.
4. **Issuer IR / original RNS material — evidence authority.** The analysis stage continues to prefer issuer and official disclosure text over discovery mirrors.

## Safety constraints

- Catalogue aliases are deduplicated by ticker, UTC publication minute and normalised headline.
- Existing source IDs are reused when the same announcement was already stored.
- FCA NSM is not assumed to be real time.
- FCA NSM is not treated as a complete AIM universe: NSM-only recovery is limited to companies already known to the AIM company repository.
- Source failures degrade independently; one failed cross-check does not suppress a valid live LSE announcement.
- No source adapter may infer a missing ticker, figure or announcement identity.

## Persistence

The permanent announcement record retains the strongest accessible source URLs. Company KPI observations remain governed separately by `kpi-integrity-v1`; changing discovery source cannot create, merge or estimate KPI datapoints.
'''
          docs_path = root / "docs/company-repository-source-architecture.md"
          docs_path.parent.mkdir(parents=True, exist_ok=True)
          docs_path.write_text(docs, encoding="utf-8")


          old_sig = '''        *,\n        repository: IntelligenceRepository | None = None,\n        **kwargs: object,\n    ) -> None:\n        super().__init__(**kwargs)\n        self.repository = repository\n        self._resolved_companies: dict[str, str] = {}'''
          new_sig = '''        *,\n        repository: IntelligenceRepository | None = None,\n        fca_client: FcaNsmClient | None = None,\n        enable_fca_reconciliation: bool = True,\n        **kwargs: object,\n    ) -> None:\n        super().__init__(**kwargs)\n        self.repository = repository\n        self.fca_client = fca_client or FcaNsmClient(\n            session=self.session,\n            timeout_seconds=self.timeout_seconds,\n        )\n        self.enable_fca_reconciliation = bool(enable_fca_reconciliation)\n        self._resolved_companies: dict[str, str] = {}'''
          if old_sig not in text:

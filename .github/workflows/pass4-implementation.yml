          fca_module = r'''from __future__ import annotations

import re
from datetime import date, datetime, time, timezone
from typing import Any, Iterable
from urllib.parse import urljoin

import requests

from analyst.models import StrictModel

FCA_NSM_SEARCH_URL = "https://api.data.fca.org.uk/search?index=fca-nsm-searchdata"
FCA_NSM_ARTEFACT_BASE = "https://data.fca.org.uk/artefacts/"


class FcaNsmRecord(StrictModel):
    disclosure_id: str
    company: str
    lei: str = ""
    headline: str
    published_at: datetime
    source_url: str
    source: str = "RNS"
    latest_flag: str = "Y"


def _clean(value: object) -> str:
    return " ".join(str(value or "").strip().split())


def headline_key(value: object) -> str:
    return " ".join(re.sub(r"[^a-z0-9]+", " ", _clean(value).lower()).split())


def company_key(value: object) -> str:
    words = headline_key(value).split()
    while words and words[0] == "the":
        words.pop(0)
    removable = {"plc", "limited", "ltd", "inc", "incorporated"}
    while words and words[-1] in removable:
        words.pop()
    return " ".join(words)


def _parse_datetime(value: object) -> datetime | None:
    text = _clean(value)
    if not text:
        return None
    candidate = text.replace("Z", "+00:00")
    try:
        parsed = datetime.fromisoformat(candidate)
    except ValueError:
        return None
    if parsed.tzinfo is None:
        parsed = parsed.replace(tzinfo=timezone.utc)
    return parsed.astimezone(timezone.utc)


def _total_hits(payload: dict[str, Any]) -> int | None:
    total = payload.get("hits", {}).get("total")
    if isinstance(total, dict):
        try:
            return int(total.get("value"))
        except (TypeError, ValueError):
            return None
    try:
        return int(total)
    except (TypeError, ValueError):
        return None


class FcaNsmClient:
    """Small, failure-tolerant client for public FCA NSM RNS metadata.

    NSM is used for verification and delayed reconciliation. It is never treated
    as a real-time AIM universe by itself because NSM covers more than AIM and
    does not publish a dependable market/ticker field for every RNS record.
    """

    def __init__(
        self,
        *,
        session: requests.Session | None = None,
        timeout_seconds: int = 20,
        page_size: int = 1000,
        max_pages: int = 4,
    ) -> None:
        self.session = session or requests.Session()
        self.timeout_seconds = max(1, int(timeout_seconds))
        self.page_size = max(1, min(int(page_size), 2000))
        self.max_pages = max(1, int(max_pages))

    @staticmethod
    def _payload(day: date, *, offset: int, size: int) -> dict[str, Any]:
        start = datetime.combine(day, time.min, tzinfo=timezone.utc)
        end = datetime.combine(day, time.max, tzinfo=timezone.utc)
        return {
            "from": offset,
            "size": size,
            "sort": "publication_date",
            "sortorder": "asc",
            "criteriaObj": {
                "criteria": [
                    {"name": "latest_flag", "value": "Y"},
                    {"name": "sourceList", "value": "RNS"},
                ],
                "dateCriteria": [
                    {
                        "name": "publication_date",
                        "value": {
                            "from": start.isoformat().replace("+00:00", "Z"),
                            "to": end.isoformat().replace("+00:00", "Z"),
                        },
                    }
                ],
            },
        }

    def list_rns(self, day: date) -> list[FcaNsmRecord]:
        output: dict[str, FcaNsmRecord] = {}
        headers = {
            "Accept": "application/json",
            "Content-Type": "application/json",
            "User-Agent": "Smallcaps.ai source reconciliation/1.0",
        }

        for page in range(self.max_pages):
            offset = page * self.page_size
            response = self.session.post(
                FCA_NSM_SEARCH_URL,
                json=self._payload(day, offset=offset, size=self.page_size),
                headers=headers,
                timeout=self.timeout_seconds,
            )
            response.raise_for_status()
            payload = response.json()
            hits = payload.get("hits", {}).get("hits", [])
            if not isinstance(hits, list):
                raise RuntimeError("FCA NSM returned an invalid hits payload")

            accepted = 0
            for hit in hits:
                source = hit.get("_source", {}) if isinstance(hit, dict) else {}
                if not isinstance(source, dict):
                    continue
                if _clean(source.get("source")).upper() != "RNS":
                    continue
                latest_flag = _clean(source.get("latest_flag")).upper() or "Y"
                if latest_flag != "Y":
                    continue
                published_at = _parse_datetime(
                    source.get("publication_date") or source.get("submitted_date")
                )
                if published_at is None or published_at.date() != day:
                    continue
                headline = _clean(source.get("headline") or source.get("document_description"))
                company = _clean(source.get("company"))
                disclosure_id = _clean(
                    source.get("disclosure_id") or source.get("seq_id") or hit.get("_id")
                )
                download_link = _clean(source.get("download_link"))
                if not disclosure_id or not headline or not company or not download_link:
                    continue
                source_url = (
                    download_link
                    if download_link.startswith(("https://", "http://"))
                    else urljoin(FCA_NSM_ARTEFACT_BASE, download_link.lstrip("/"))
                )
                output[disclosure_id] = FcaNsmRecord(
                    disclosure_id=disclosure_id,
                    company=company,
                    lei=_clean(source.get("lei")),
                    headline=headline,
                    published_at=published_at,
                    source_url=source_url,
                    source="RNS",
                    latest_flag=latest_flag,
                )
                accepted += 1

            total = _total_hits(payload)
            if len(hits) < self.page_size:
                break
            if total is not None and offset + len(hits) >= total:
                break
            if not hits or not accepted:
                break

        return sorted(output.values(), key=lambda item: item.published_at)


def match_nsm_record(
    *,
    headline: str,
    published_at: datetime,
    company: str = "",
    records: Iterable[FcaNsmRecord],
    tolerance_minutes: int = 90,
) -> FcaNsmRecord | None:
    target_headline = headline_key(headline)
    target_company = company_key(company)
    target_time = published_at
    if target_time.tzinfo is None:
        target_time = target_time.replace(tzinfo=timezone.utc)
    target_time = target_time.astimezone(timezone.utc)

    candidates: list[tuple[float, FcaNsmRecord]] = []
    for record in records:
        if headline_key(record.headline) != target_headline:
            continue
        if record.published_at.date() != target_time.date():
            continue
        record_company = company_key(record.company)
        if target_company and record_company:
            compatible = (
                target_company == record_company
                or target_company in record_company
                or record_company in target_company
            )
            if not compatible:
                continue
        delta = abs((record.published_at - target_time).total_seconds()) / 60.0
        if delta <= max(0, tolerance_minutes):
            candidates.append((delta, record))

    if not candidates:
        return None
    candidates.sort(key=lambda item: (item[0], item[1].disclosure_id))
    return candidates[0][1]
'''

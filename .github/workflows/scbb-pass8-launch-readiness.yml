name: scbb-pass8-launch-readiness

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scbb-pass8-launch-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///data/scbb-pass8-preview.db
      PRIVATE_BETA_MODE: "false"
      APP_BETA_PASSWORD: preview-access
      APP_ADMIN_PASSWORD: preview-admin
      MARKET_DATA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node --check frontend/assets/research.js
          node --check frontend/assets/watchlist.js
          node --check frontend/assets/company.js
          node --check frontend/assets/daily.js
          node --check frontend/assets/product-shell.js

      - name: Seed deterministic launch product
        run: |
          rm -f data/scbb-pass8-preview.db
          python -m jobs.seed_launch_preview
          python -m jobs.seed_pass1_preview

      - name: Start combined product
        shell: bash
        run: |
          mkdir -p /tmp/scbb-pass8-audit
          python -m uvicorn web_app:app --host 127.0.0.1 --port 8501 \
            > /tmp/scbb-pass8-audit/web.log 2>&1 &
          echo $! > /tmp/scbb-pass8-web.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/api/v1/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8501/api/v1/company/SPR >/dev/null \
              && curl --fail --silent 'http://127.0.0.1:8501/api/v1/aim-daily/newsroom?date=2026-08-21&state=aim_close' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scbb-pass8-audit/web.log
          exit 1

      - name: Validate the complete launch journey
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          from playwright.sync_api import expect, sync_playwright

          out = Path('/tmp/scbb-pass8-audit')
          base = 'http://127.0.0.1:8501'
          expected_nav = ['/rns', '/rns?watchlist=1', '/']
          footer_copy = 'Independent AIM research. Facts first. Not personal investment advice.'

          def capture(page):
              failures = []
              page.on('pageerror', lambda error: failures.append(f'pageerror: {error}'))
              page.on('console', lambda message: failures.append(f'console: {message.text}') if message.type == 'error' else None)
              return failures

          def assert_clean(failures, label):
              if failures:
                  raise AssertionError(f'{label}: {failures}')

          def assert_basics(page, active):
              hrefs = page.locator('nav[aria-label="Primary navigation"] a').evaluate_all(
                  "els => els.map(el => el.getAttribute('href'))"
              )
              if hrefs != expected_nav:
                  raise AssertionError(f'Navigation drifted: {hrefs}')
              expect(page.locator(f'[data-product-nav="{active}"]')).to_have_attribute('aria-current', 'page')
              expect(page.locator('[data-product-status]')).to_have_text('AIM live')
              page.get_by_text(footer_copy, exact=True).wait_for(timeout=30000)
              dims = page.evaluate(
                  """
                  () => ({
                    client: document.documentElement.clientWidth,
                    scroll: document.documentElement.scrollWidth,
                    body: document.body.scrollWidth,
                    duplicates: [...document.querySelectorAll('[id]')]
                      .map(node => node.id)
                      .filter((id, index, values) => values.indexOf(id) !== index),
                  })
                  """
              )
              if dims['scroll'] > dims['client'] + 2 or dims['body'] > dims['client'] + 2:
                  raise AssertionError(f'Document clips horizontally: {dims}')
              if dims['duplicates']:
                  raise AssertionError(f'Duplicate ids: {dims}')
              external = [
                  url for url in page.evaluate(
                      "() => performance.getEntriesByType('resource').map(entry => entry.name)"
                  )
                  if urlparse(url).netloc not in {'', '127.0.0.1:8501'}
                  and not url.startswith(('data:', 'blob:'))
              ]
              if external:
                  raise AssertionError(f'Unexpected external launch assets: {external}')

          def wait_news(page, *, watchlist=False):
              page.get_by_role(
                  'heading',
                  name='Your watchlist.' if watchlist else 'Facts. No fluff.',
                  exact=True,
              ).wait_for(timeout=30000)
              if watchlist:
                  return
              page.locator('article.monitor-row').first.wait_for(timeout=30000)

          def wait_company(page, ticker='SPR'):
              page.get_by_role('heading', name=ticker, exact=True).wait_for(timeout=30000)
              current = page.locator('[data-company-section="current-position"]')
              current.wait_for(timeout=30000)
              page.get_by_role('heading', name='Current position', exact=True).wait_for(timeout=30000)
              page.get_by_role('heading', name='Evidence trail', exact=True).wait_for(timeout=30000)
              current.get_by_text('What changed', exact=True).wait_for(timeout=30000)
              current.get_by_text('Smallcaps.ai view', exact=True).wait_for(timeout=30000)
              return current

          def wait_daily(page):
              page.get_by_role('heading', name='THE AIM DAILY', exact=True).wait_for(timeout=30000)
              expect(page.locator('#edition-summary')).to_contain_text('full analyses', timeout=30000)
              page.locator('.lead-layout').wait_for(timeout=30000)
              if 'THE REST OF AIM' not in page.locator('body').inner_text():
                  raise AssertionError('The Daily no longer explains suppressed coverage')

          def mobile_header(page):
              return page.evaluate(
                  """
                  () => {
                    const header = document.querySelector('.site-header').getBoundingClientRect();
                    const brand = document.querySelector('.wordmark').getBoundingClientRect();
                    const nav = document.querySelector('.primary-nav').getBoundingClientRect();
                    const signOut = document.querySelector('.text-action').getBoundingClientRect();
                    return {
                      headerHeight: header.height,
                      brandBottom: brand.bottom,
                      navTop: nav.top,
                      navHeight: nav.height,
                      signOutHeight: signOut.height,
                    };
                  }
                  """
              )

          with sync_playwright() as p:
              browser = p.chromium.launch()

              desktop = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = desktop.new_page()
              failures = capture(page)
              page.goto(f'{base}/rns?date=2026-08-21', wait_until='domcontentloaded')
              wait_news(page)
              assert_basics(page, 'news')

              company_link = page.locator('article.monitor-row[data-source-id="spr-preview-buyback"] a.company-research-link')
              company_link.wait_for(timeout=30000)
              page.wait_for_function(
                  "el => new URL(el.href).searchParams.get('from') === 'news'",
                  company_link.element_handle(),
              )
              href = company_link.get_attribute('href')
              query = parse_qs(urlparse(href).query)
              if query.get('open') != ['spr-preview-buyback'] or query.get('date') != ['2026-08-21']:
                  raise AssertionError(f'News-to-company context is incomplete: {href}')
              company_link.click()

              current = wait_company(page)
              assert_basics(page, 'news')
              view_words = current.locator('.company-view-copy p').inner_text().strip().split()
              if not view_words or len(view_words) > 50:
                  raise AssertionError(f'Company view is not terse: {len(view_words)} words')
              computed = page.evaluate(
                  """
                  () => ({
                    background: getComputedStyle(document.body).backgroundColor,
                    surface: getComputedStyle(document.querySelector('.company-position-card')).backgroundColor,
                    headingSize: parseFloat(getComputedStyle(document.querySelector('.company-hero h1')).fontSize),
                    accent: getComputedStyle(document.querySelector('.company-hero h1 em')).color,
                  })
                  """
              )
              if computed['background'] != 'rgb(245, 246, 248)' or computed['surface'] != 'rgb(255, 255, 255)':
                  raise AssertionError(f'Company Intelligence visual system drifted: {computed}')
              if computed['accent'] != 'rgb(37, 99, 235)' or not 42 <= computed['headingSize'] <= 72:
                  raise AssertionError(f'Company Intelligence hierarchy drifted: {computed}')
              expect(page.locator('#company-context-link')).to_have_attribute(
                  'href', '/rns?date=2026-08-21&open=spr-preview-buyback'
              )
              page.locator('.company-current-evidence > summary').click()
              page.get_by_role('heading', name='Reported facts', exact=True).wait_for(timeout=30000)
              page.get_by_role('heading', name='Before → now', exact=True).wait_for(timeout=30000)
              page.screenshot(path=out / '01-company-launch-desktop.png', full_page=True)

              page.locator('#company-context-link').click()
              page.wait_for_url(f'{base}/rns?date=2026-08-21&open=spr-preview-buyback', timeout=30000)
              wait_news(page)
              expect(page.locator('article.monitor-row[data-source-id="spr-preview-buyback"] .row-toggle')).to_have_attribute('aria-expanded', 'true')
              assert_basics(page, 'news')

              page.goto(f'{base}/?date=2026-08-21&state=aim_close', wait_until='domcontentloaded')
              wait_daily(page)
              assert_basics(page, 'daily')
              page.screenshot(path=out / '02-aim-daily-launch-desktop.png', full_page=True)
              assert_clean(failures, 'desktop launch')
              desktop.close()

              mobile = browser.new_context(viewport={'width': 390, 'height': 844}, device_scale_factor=1, is_mobile=True)
              page = mobile.new_page()
              failures = capture(page)

              page.goto(f'{base}/rns?date=2026-08-21', wait_until='domcontentloaded')
              wait_news(page)
              assert_basics(page, 'news')
              news_header = mobile_header(page)

              page.goto(f'{base}/company/SPR', wait_until='domcontentloaded')
              current = wait_company(page)
              assert_basics(page, 'news')
              company_header = mobile_header(page)
              grid = page.locator('.company-position-main').evaluate('(el) => getComputedStyle(el).gridTemplateColumns')
              if len(grid.split()) != 1:
                  raise AssertionError(f'Mobile company position did not collapse: {grid}')
              for selector in ('#company-watch-toggle', '.company-action', '.company-current-evidence > summary'):
                  box = page.locator(selector).first.bounding_box()
                  if box is None or box['height'] < 43.5:
                      raise AssertionError(f'Mobile target is too small: {selector} {box}')
              page.screenshot(path=out / '03-company-launch-mobile.png', full_page=True)

              page.goto(f'{base}/rns?watchlist=1', wait_until='domcontentloaded')
              wait_news(page, watchlist=True)
              page.get_by_text('Your watchlist is empty.', exact=True).wait_for(timeout=30000)
              assert_basics(page, 'watchlist')
              watchlist_header = mobile_header(page)

              page.goto(f'{base}/?date=2026-08-21&state=aim_close', wait_until='domcontentloaded')
              wait_daily(page)
              assert_basics(page, 'daily')
              daily_header = mobile_header(page)
              page.screenshot(path=out / '04-aim-daily-launch-mobile.png', full_page=True)

              headers = {
                  'news': news_header,
                  'company': company_header,
                  'watchlist': watchlist_header,
                  'daily': daily_header,
              }
              for name, header in headers.items():
                  if header['navTop'] < header['brandBottom'] - 1:
                      raise AssertionError(f'{name} navigation overlaps the brand row: {header}')
                  if header['navHeight'] < 43.5 or header['signOutHeight'] < 43.5:
                      raise AssertionError(f'{name} shared header controls are too small: {header}')
              heights = [header['headerHeight'] for header in headers.values()]
              if max(heights) - min(heights) > 2:
                  raise AssertionError(f'Launch headers are no longer one component: {headers}')

              assert_clean(failures, 'mobile launch')
              mobile.close()
              browser.close()
          PY

      - name: Reject runtime failures
        run: |
          if grep -En 'Traceback \(most recent call last\)|Uncaught app exception|company-api-error|monitoring-api-error|newsroom-api-error' /tmp/scbb-pass8-audit/web.log; then
            cat /tmp/scbb-pass8-audit/web.log
            exit 1
          fi

      - name: Upload launch-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallcaps-pass8-launch-readiness
          path: /tmp/scbb-pass8-audit
          if-no-files-found: error
          retention-days: 90

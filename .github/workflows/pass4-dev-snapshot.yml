name: pass4-dev-snapshot

on:
  push:
    branches: ["company-repo-pass-4-production-migration"]
    paths:
      - ".github/workflows/pass4-dev-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source snapshot
        run: tar --exclude=.git -czf /tmp/smallcaps-pass4-src.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: smallcaps-pass4-source-snapshot
          path: /tmp/smallcaps-pass4-src.tar.gz
          retention-days: 1

name: scbb-pass5-unified-product-audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scbb-pass5-unified-product-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unified-investor-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///data/scbb-pass5-preview.db
      PRIVATE_BETA_MODE: "true"
      APP_BETA_PASSWORD: preview-access
      APP_ADMIN_PASSWORD: preview-admin
      MARKET_DATA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Validate unified frontend scripts
        run: |
          node --check frontend/assets/research.js
          node --check frontend/assets/company.js
          node --check frontend/assets/company-journey.js
          test ! -e frontend/assets/feed-company.js

      - name: Seed deterministic unified product data
        run: |
          rm -f data/scbb-pass5-preview.db
          python -m jobs.seed_launch_preview
          python -m jobs.seed_pass1_preview

      - name: Start the private-beta product
        shell: bash
        run: |
          mkdir -p /tmp/scbb-pass5-audit
          python -m uvicorn web_app:app --host 127.0.0.1 --port 8501 \
            > /tmp/scbb-pass5-audit/web.log 2>&1 &
          echo $! > /tmp/scbb-pass5-web.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/api/v1/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8501/api/v1/company/SPR >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scbb-pass5-audit/web.log
          exit 1

      - name: Validate the complete Feed and Company Intelligence journey
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          from playwright.sync_api import expect, sync_playwright

          out = Path('/tmp/scbb-pass5-audit')
          base = 'http://127.0.0.1:8501'

          def expected_http_failure(response):
              parsed = urlparse(response.url)
              return (
                  response.status == 401 and parsed.path == '/access'
              ) or (
                  response.status == 404 and parsed.path == '/api/v1/company/NOTREAL'
              )

          def guard(page):
              failures = []
              page.on('pageerror', lambda error: failures.append(f'pageerror: {error}'))
              page.on(
                  'console',
                  lambda message: failures.append(f'console error: {message.text}')
                  if message.type == 'error'
                  and not message.text.startswith('Failed to load resource:')
                  else None,
              )
              page.on(
                  'response',
                  lambda response: failures.append(
                      f'http {response.status}: {response.url}'
                  )
                  if response.status >= 400 and not expected_http_failure(response)
                  else None,
              )
              return failures

          def no_overflow(page):
              dims = page.evaluate(
                  """
                  () => ({
                    client: document.documentElement.clientWidth,
                    scroll: document.documentElement.scrollWidth,
                    body: document.body.scrollWidth,
                  })
                  """
              )
              if dims['scroll'] > dims['client'] + 2 or dims['body'] > dims['client'] + 2:
                  raise AssertionError(f'Document clips horizontally: {dims}')

          def no_duplicate_ids(page):
              duplicates = page.evaluate(
                  """
                  () => {
                    const counts = new Map();
                    document.querySelectorAll('[id]').forEach((node) => {
                      counts.set(node.id, (counts.get(node.id) || 0) + 1);
                    });
                    return [...counts.entries()].filter(([, count]) => count > 1);
                  }
                  """
              )
              if duplicates:
                  raise AssertionError(f'Duplicate DOM ids: {duplicates}')

          def authenticate(page, destination, *, reject_once=False):
              page.goto(f'{base}{destination}', wait_until='domcontentloaded')
              page.get_by_text('PRIVATE BETA ACCESS', exact=True).wait_for(timeout=30000)
              expect(page.locator('input[name="next"]')).to_have_value(destination)
              if reject_once:
                  page.get_by_label('ACCESS CODE', exact=True).fill('not-the-code')
                  page.get_by_role('button', name=re.compile('ENTER SMALLCAPS.AI')).click()
                  page.get_by_role('alert').wait_for(timeout=30000)
                  expect(page.locator('input[name="next"]')).to_have_value(destination)
              page.get_by_label('ACCESS CODE', exact=True).fill('preview-access')
              page.get_by_role('button', name=re.compile('ENTER SMALLCAPS.AI')).click()
              page.wait_for_url(f'{base}{destination}', timeout=30000)

          def wait_feed(page, source_id=None):
              page.get_by_role('heading', name='AIM RNS feed', exact=True).wait_for(timeout=30000)
              page.locator('article.monitor-row').first.wait_for(timeout=30000)
              page.wait_for_function(
                  "document.getElementById('feed-count').textContent.includes('announcements')",
                  timeout=30000,
              )
              if source_id:
                  row = page.locator(f'article.monitor-row[data-source-id="{source_id}"]')
                  row.wait_for(timeout=30000)
                  expect(row.locator('button.row-toggle')).to_have_attribute('aria-expanded', 'true')
                  row.locator('.expanded-research:not([hidden])').wait_for(timeout=30000)
                  page.wait_for_function(
                      f"document.activeElement === document.querySelector('article.monitor-row[data-source-id=\\\"{source_id}\\\"] button.row-toggle')",
                      timeout=30000,
                  )
                  return row
              return None

          def wait_company(page, ticker):
              page.get_by_role('heading', name=ticker, exact=True).wait_for(timeout=30000)
              page.locator('[data-company-section="current-view"]').wait_for(timeout=30000)
              page.wait_for_timeout(250)

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()

              desktop = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = desktop.new_page()
              desktop_failures = guard(page)

              destination = '/?date=2026-08-21&open=spr-preview-buyback'
              authenticate(page, destination, reject_once=True)
              springfield_row = wait_feed(page, 'spr-preview-buyback')
              expect(page.locator('#active-day')).to_have_text('21 AUG 2026')
              expect(springfield_row.locator('a.company-research-link')).to_have_attribute('href', '/company/SPR')
              no_overflow(page)
              no_duplicate_ids(page)
              page.screenshot(path=out / '01-unified-deep-link-feed-desktop.png', full_page=True)

              page.get_by_role('button', name='RESET', exact=True).click()
              query = parse_qs(urlparse(page.url).query)
              if 'open' in query or query.get('date') != ['2026-08-21']:
                  raise AssertionError(f'Reset did not retain only the market-day state: {page.url}')

              page.get_by_label('SEARCH', exact=True).fill('Trellus')
              expect(page.locator('#result-status')).to_have_text('1 of 6 announcements shown')
              expect(page.locator('article.monitor-row')).to_have_count(1)
              expect(page.locator('article.monitor-row .ticker')).to_have_text('TRLS')
              page.get_by_role('button', name='RESET', exact=True).click()
              page.get_by_role('button', name='IMPACT 3+', exact=True).click()
              expect(page.locator('article.monitor-row')).to_have_count(5)
              page.get_by_role('button', name='GROUP BY COMPANY', exact=True).click()
              expect(page.get_by_role('button', name='GROUP BY COMPANY', exact=True)).to_have_attribute('aria-pressed', 'true')
              page.get_by_role('button', name='RESET', exact=True).click()

              springfield = page.locator('article.monitor-row[data-source-id="spr-preview-buyback"]')
              springfield.locator('a.company-research-link').click()
              wait_company(page, 'SPR')
              expect(page.locator('.company-feed-link')).to_have_count(2)
              expect(page.locator('[role="table"]')).to_have_count(4)
              page.get_by_text('LATEST REPORTED', exact=True).first.wait_for(timeout=30000)
              expect(page.get_by_role('button', name='Sign out', exact=True)).to_be_visible()
              no_overflow(page)
              no_duplicate_ids(page)
              page.screenshot(path=out / '02-company-roundtrip-desktop.png', full_page=True)

              page.get_by_role('link', name='OPEN IN RNS FEED →', exact=True).click()
              page.wait_for_url(f'{base}/?date=2026-08-21&open=spr-preview-buyback', timeout=30000)
              wait_feed(page, 'spr-preview-buyback')
              page.screenshot(path=out / '03-current-rns-roundtrip-desktop.png', full_page=True)

              page.go_back(wait_until='domcontentloaded')
              wait_company(page, 'SPR')
              prior = page.locator('article.company-history-row[data-source-id="spr-preview-prior"]')
              prior.locator('a.company-feed-link').click()
              page.wait_for_url(f'{base}/?date=2026-08-01&open=spr-preview-prior', timeout=30000)
              wait_feed(page, 'spr-preview-prior')
              expect(page.locator('#active-day')).to_have_text('1 AUG 2026')
              expect(page.locator('article.monitor-row')).to_have_count(1)
              no_overflow(page)
              no_duplicate_ids(page)
              page.screenshot(path=out / '04-historical-rns-return-laptop.png', full_page=True)

              page.goto(f'{base}/company/NOTREAL', wait_until='domcontentloaded')
              page.get_by_text('Company Intelligence is temporarily unavailable.', exact=True).wait_for(timeout=30000)
              no_overflow(page)

              if desktop_failures:
                  raise AssertionError(f'Desktop browser failures: {desktop_failures}')
              desktop.close()

              mobile = browser.new_context(
                  viewport={'width': 390, 'height': 844},
                  device_scale_factor=1,
                  is_mobile=True,
              )
              page = mobile.new_page()
              mobile_failures = guard(page)
              authenticate(page, '/company/SPR')
              wait_company(page, 'SPR')

              sign_out = page.get_by_role('button', name='Sign out', exact=True)
              expect(sign_out).to_be_visible()
              sign_out_box = sign_out.bounding_box()
              if sign_out_box is None or sign_out_box['height'] < 35.5:
                  raise AssertionError(f'Mobile sign-out target is too small: {sign_out_box}')
              expect(page.locator('.status-compact')).to_be_visible()
              expect(page.locator('.status-full')).to_be_hidden()
              expect(page.locator('.company-feed-link')).to_have_count(2)

              feed_link = page.locator('.company-feed-link').first
              feed_box = feed_link.bounding_box()
              if feed_box is None or feed_box['height'] < 43.5:
                  raise AssertionError(f'Mobile company-to-feed target is too small: {feed_box}')
              no_overflow(page)
              no_duplicate_ids(page)
              page.screenshot(path=out / '05-unified-company-mobile.png', full_page=True)

              feed_link.click()
              page.wait_for_url(f'{base}/?date=2026-08-21&open=spr-preview-buyback', timeout=30000)
              row = wait_feed(page, 'spr-preview-buyback')
              columns = row.locator('.monitor-row-grid').evaluate(
                  '(element) => getComputedStyle(element).gridTemplateColumns'
              )
              if ' ' in columns.strip():
                  raise AssertionError(f'Mobile monitoring row did not collapse to one column: {columns}')
              toggle_box = row.locator('button.row-toggle').bounding_box()
              if toggle_box is None or toggle_box['height'] < 27.5:
                  raise AssertionError(f'Mobile feed toggle is too small: {toggle_box}')
              no_overflow(page)
              no_duplicate_ids(page)
              page.screenshot(path=out / '06-unified-feed-mobile.png', full_page=True)

              sign_out = page.get_by_role('button', name='Sign out', exact=True)
              sign_out.click()
              page.get_by_text('PRIVATE BETA ACCESS', exact=True).wait_for(timeout=30000)

              if mobile_failures:
                  raise AssertionError(f'Mobile browser failures: {mobile_failures}')
              mobile.close()
              browser.close()
          PY

      - name: Reject runtime and frontend failures
        run: |
          if grep -En 'Traceback \(most recent call last\)|Uncaught app exception|company-api-error|monitoring-api-error' /tmp/scbb-pass5-audit/web.log; then
            cat /tmp/scbb-pass5-audit/web.log
            exit 1
          fi

      - name: Upload Pass 5 unified-product audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallcaps-scbb-pass5-unified-product-audit
          path: /tmp/scbb-pass5-audit
          if-no-files-found: error
          retention-days: 90

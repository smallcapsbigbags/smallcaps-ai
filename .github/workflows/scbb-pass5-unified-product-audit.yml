name: scbb-pass5-unified-product-audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scbb-pass5-unified-product-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unified-investor-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///data/scbb-pass5-preview.db
      PRIVATE_BETA_MODE: "true"
      APP_BETA_PASSWORD: preview-access
      APP_ADMIN_PASSWORD: preview-admin
      MARKET_DATA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node --check frontend/assets/research.js
          node --check frontend/assets/watchlist.js
          node --check frontend/assets/company-watchlist.js
          node --check frontend/assets/company.js
          node --check frontend/assets/daily.js
          node --check frontend/assets/product-shell.js

      - name: Enforce the shared product shell contract
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in (
              Path('frontend/index.html'),
              Path('frontend/daily.html'),
              Path('frontend/company.html'),
          ):
              html = path.read_text(encoding='utf-8')
              for required in (
                  'product-page',
                  '/assets/product-shell.css?v={{ASSET_VERSION}}',
                  '/assets/product-shell.js?v={{ASSET_VERSION}}',
                  'data-product-nav="news"',
                  'data-product-nav="watchlist"',
                  'data-product-nav="daily"',
                  'data-product-status>AIM live</span>',
                  'data-watchlist-count',
                  'Independent AIM research. Facts first. Not personal investment advice.',
              ):
                  if required not in html:
                      raise AssertionError(f'{path} is missing {required}')

          daily = Path('frontend/daily.html').read_text(encoding='utf-8')
          if '/assets/research.css' in daily:
              raise AssertionError('The AIM Daily still loads the retired dark stylesheet')

          access = Path('frontend/access.html').read_text(encoding='utf-8')
          for required in (
              'product-access-page',
              '/assets/news.css?v={{ASSET_VERSION}}',
              '/assets/product-shell.css?v={{ASSET_VERSION}}',
              '<meta name="color-scheme" content="light">',
          ):
              if required not in access:
                  raise AssertionError(f'Private beta entry is missing {required}')
          PY

      - name: Seed deterministic unified product data
        run: |
          rm -f data/scbb-pass5-preview.db
          python -m jobs.seed_launch_preview
          python -m jobs.seed_pass1_preview

      - name: Start the private-beta product
        shell: bash
        run: |
          mkdir -p /tmp/scbb-pass5-audit
          python -m uvicorn web_app:app --host 127.0.0.1 --port 8501 \
            > /tmp/scbb-pass5-audit/web.log 2>&1 &
          echo $! > /tmp/scbb-pass5-web.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/api/v1/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8501/api/v1/company/SPR >/dev/null \
              && curl --fail --silent 'http://127.0.0.1:8501/api/v1/aim-daily/newsroom?date=2026-08-21&state=aim_close' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scbb-pass5-audit/web.log
          exit 1

      - name: Validate News, Watchlist, Daily and Company round-trips
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          from playwright.sync_api import expect, sync_playwright

          out = Path('/tmp/scbb-pass5-audit')
          base = 'http://127.0.0.1:8501'
          expected_nav = ['/rns', '/rns?watchlist=1', '/']
          footer_copy = 'Independent AIM research. Facts first. Not personal investment advice.'

          def capture(page):
              failures = []
              page.on('pageerror', lambda error: failures.append(f'pageerror: {error}'))
              page.on(
                  'console',
                  lambda message: failures.append(f'console: {message.text}')
                  if message.type == 'error' else None,
              )
              return failures

          def assert_clean(failures, label):
              if failures:
                  raise AssertionError(f'{label}: {failures}')

          def assert_no_overflow(page):
              dims = page.evaluate(
                  """
                  () => ({
                    client: document.documentElement.clientWidth,
                    scroll: document.documentElement.scrollWidth,
                    body: document.body.scrollWidth,
                    duplicates: [...document.querySelectorAll('[id]')]
                      .map(node => node.id)
                      .filter((id, index, values) => values.indexOf(id) !== index),
                  })
                  """
              )
              if dims['scroll'] > dims['client'] + 2 or dims['body'] > dims['client'] + 2:
                  raise AssertionError(f'Document clips horizontally: {dims}')
              if dims['duplicates']:
                  raise AssertionError(f'Duplicate DOM ids: {dims}')

          def authenticate(page, destination):
              page.goto(f'{base}{destination}', wait_until='domcontentloaded')
              page.get_by_text('PRIVATE BETA ACCESS', exact=True).wait_for(timeout=30000)
              expect(page.locator('input[name="next"]')).to_have_value(destination)
              colours = page.evaluate(
                  """
                  () => ({
                    body: getComputedStyle(document.body).backgroundColor,
                    panel: getComputedStyle(document.querySelector('.access-panel')).backgroundColor,
                  })
                  """
              )
              if colours != {'body': 'rgb(245, 246, 248)', 'panel': 'rgb(255, 255, 255)'}:
                  raise AssertionError(f'Private beta entry is outside the light shell: {colours}')
              page.get_by_label('ACCESS CODE', exact=True).fill('preview-access')
              page.get_by_role('button', name='ENTER SMALLCAPS.AI', exact=True).click()
              page.wait_for_url(f'{base}{destination}', timeout=30000)

          def assert_shell(page, active, watch_count=None):
              hrefs = page.locator('nav[aria-label="Primary navigation"] a').evaluate_all(
                  "els => els.map(el => el.getAttribute('href'))"
              )
              if hrefs != expected_nav:
                  raise AssertionError(f'Navigation drifted: {hrefs}')
              expect(page.locator(f'[data-product-nav="{active}"]')).to_have_attribute(
                  'aria-current', 'page'
              )
              expect(page.locator('[data-product-status]')).to_have_text('AIM live')
              page.get_by_text(footer_copy, exact=True).wait_for(timeout=30000)
              if watch_count is not None:
                  badge = page.locator('[data-watchlist-count]')
                  if watch_count:
                      expect(badge).to_have_text(str(watch_count))
                      expect(badge).to_be_visible()
                  else:
                      expect(badge).to_have_text('')
                      expect(badge).to_be_hidden()
              assert_no_overflow(page)

          def wait_news(page, source_id=None, watchlist=False):
              page.get_by_role(
                  'heading',
                  name='Your watchlist.' if watchlist else 'Facts. No fluff.',
                  exact=True,
              ).wait_for(timeout=30000)
              if source_id:
                  row = page.locator(f'article.monitor-row[data-source-id="{source_id}"]')
                  row.wait_for(timeout=30000)
                  expect(row.locator('button.row-toggle')).to_have_attribute(
                      'aria-expanded', 'true'
                  )
                  row.locator('.expanded-research:not([hidden])').wait_for(timeout=30000)
                  return row
              if watchlist:
                  page.locator('article.monitor-row').first.wait_for(timeout=30000)
                  return None
              page.locator('article.monitor-row').first.wait_for(timeout=30000)
              return None

          def wait_company(page, ticker):
              page.get_by_role('heading', name=ticker, exact=True).wait_for(timeout=30000)
              page.locator('[data-company-section="current-position"]').wait_for(timeout=30000)
              page.get_by_role('heading', name='Current position', exact=True).wait_for(timeout=30000)
              page.get_by_role('heading', name='Evidence trail', exact=True).wait_for(timeout=30000)

          def wait_daily(page):
              page.get_by_role('heading', name='THE AIM DAILY', exact=True).wait_for(timeout=30000)
              expect(page.locator('#edition-summary')).to_contain_text(
                  'full analyses', timeout=30000
              )
              page.locator('.lead-layout').wait_for(timeout=30000)

          def wait_href(page, anchor, needle):
              href = ''
              for _ in range(120):
                  href = anchor.get_attribute('href') or ''
                  if needle in href:
                      return href
                  page.wait_for_timeout(50)
              raise AssertionError(f'Link never gained {needle}: {href}')

          def assert_company_href(href, context, source_id='', date=''):
              parsed = urlparse(href)
              query = parse_qs(parsed.query)
              if not parsed.path.startswith('/company/') or query.get('from') != [context]:
                  raise AssertionError(f'Company link lost product context: {href}')
              if source_id and query.get('open') != [source_id]:
                  raise AssertionError(f'Company link lost announcement context: {href}')
              if date and query.get('date') != [date]:
                  raise AssertionError(f'Company link lost market date: {href}')
              return parsed, query

          def mobile_header(page):
              return page.evaluate(
                  """
                  () => {
                    const header = document.querySelector('.site-header').getBoundingClientRect();
                    const brand = document.querySelector('.wordmark').getBoundingClientRect();
                    const nav = document.querySelector('.primary-nav').getBoundingClientRect();
                    const signOut = document.querySelector('.text-action').getBoundingClientRect();
                    return {
                      headerHeight: header.height,
                      brandBottom: brand.bottom,
                      navTop: nav.top,
                      navHeight: nav.height,
                      signOutHeight: signOut.height,
                    };
                  }
                  """
              )

          with sync_playwright() as p:
              browser = p.chromium.launch()

              desktop = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = desktop.new_page()
              failures = capture(page)

              destination = '/rns?date=2026-08-21&open=spr-preview-buyback'
              authenticate(page, destination)
              row = wait_news(page, 'spr-preview-buyback')
              assert_shell(page, 'news', 0)
              expect(page.locator('#active-day')).to_have_text('21 Aug 2026')
              expect(page.locator('#feed-mode')).to_have_text('Key News')
              expect(page.locator('article.monitor-row')).to_have_count(5)

              company_link = row.locator('a.company-research-link')
              href = wait_href(page, company_link, 'from=news')
              assert_company_href(
                  href,
                  context='news',
                  source_id='spr-preview-buyback',
                  date='2026-08-21',
              )

              star = row.locator('button.watch-toggle')
              star.click()
              expect(star).to_have_attribute('aria-pressed', 'true')
              assert_shell(page, 'news', 1)
              page.screenshot(path=out / '01-news-unified-desktop.png', full_page=True)

              company_link.click()
              wait_company(page, 'SPR')
              assert_shell(page, 'news', 1)
              expect(page.locator('#company-context-link')).to_have_text(
                  '← Back to Company News'
              )
              expect(page.locator('#company-context-link')).to_have_attribute(
                  'href', '/rns?date=2026-08-21&open=spr-preview-buyback'
              )
              page.get_by_text('Smallcaps.ai view', exact=True).wait_for(timeout=30000)
              page.get_by_text('Show supporting evidence', exact=True).wait_for(timeout=30000)
              page.screenshot(path=out / '02-company-from-news-desktop.png', full_page=True)

              page.locator('#company-context-link').click()
              page.wait_for_url(
                  f'{base}/rns?date=2026-08-21&open=spr-preview-buyback',
                  timeout=30000,
              )
              wait_news(page, 'spr-preview-buyback')
              assert_shell(page, 'news', 1)

              page.locator('[data-product-nav="watchlist"]').click()
              page.wait_for_url(f'{base}/rns?watchlist=1', timeout=30000)
              wait_news(page, watchlist=True)
              assert_shell(page, 'watchlist', 1)
              expect(page.locator('#page-eyebrow')).to_have_text('PERSONAL COMPANY NEWS')
              expect(page.locator('#feed-tagline')).to_have_text(
                  'Every update from the AIM companies you follow, in one place.'
              )
              watch_row = page.locator(
                  'article.monitor-row[data-source-id="spr-preview-buyback"]'
              )
              watch_row.wait_for(timeout=30000)
              watch_company = watch_row.locator('a.company-research-link')
              href = wait_href(page, watch_company, 'from=watchlist')
              assert_company_href(
                  href,
                  context='watchlist',
                  source_id='spr-preview-buyback',
              )
              page.screenshot(path=out / '03-watchlist-unified-desktop.png', full_page=True)

              watch_company.click()
              wait_company(page, 'SPR')
              assert_shell(page, 'watchlist', 1)
              expect(page.locator('#company-context-link')).to_have_text('← Back to Watchlist')
              expect(page.locator('#company-context-link')).to_have_attribute(
                  'href', '/rns?watchlist=1&open=spr-preview-buyback'
              )
              page.get_by_role(
                  'link', name='Open in Watchlist →', exact=True
              ).wait_for(timeout=30000)
              page.screenshot(path=out / '04-company-from-watchlist-desktop.png', full_page=True)

              page.locator('#company-context-link').click()
              page.wait_for_url(
                  f'{base}/rns?watchlist=1&open=spr-preview-buyback',
                  timeout=30000,
              )
              wait_news(page, 'spr-preview-buyback', watchlist=True)
              assert_shell(page, 'watchlist', 1)

              page.goto(
                  f'{base}/?date=2026-08-21&state=aim_close',
                  wait_until='domcontentloaded',
              )
              wait_daily(page)
              assert_shell(page, 'daily', 1)
              daily_link = page.locator('a[href^="/company/"]').first
              daily_link.wait_for(timeout=30000)
              href = wait_href(page, daily_link, 'from=daily')
              parsed = urlparse(href)
              query = parse_qs(parsed.query)
              if query.get('daily_state') != ['aim_close'] or query.get('daily_date') != ['2026-08-21']:
                  raise AssertionError(f'Daily company link lost edition context: {href}')
              ticker = parsed.path.rsplit('/', 1)[-1]
              page.screenshot(path=out / '05-daily-unified-desktop.png', full_page=True)

              daily_link.click()
              wait_company(page, ticker)
              assert_shell(page, 'daily', 1)
              expect(page.locator('#company-context-link')).to_have_text(
                  '← Back to The AIM Daily'
              )
              daily_back = page.locator('#company-context-link').get_attribute('href')
              parsed_back = urlparse(daily_back)
              if parsed_back.path != '/' or parse_qs(parsed_back.query) != {
                  'state': ['aim_close'],
                  'date': ['2026-08-21'],
              }:
                  raise AssertionError(f'Daily return context is incomplete: {daily_back}')
              page.screenshot(path=out / '06-company-from-daily-desktop.png', full_page=True)

              page.locator('#company-context-link').click()
              page.wait_for_url(
                  lambda url: url.path == '/'
                  and parse_qs(url.query).get('state') == ['aim_close']
                  and parse_qs(url.query).get('date') == ['2026-08-21'],
                  timeout=30000,
              )
              wait_daily(page)
              assert_shell(page, 'daily', 1)
              assert_clean(failures, 'desktop unified product')
              desktop.close()

              mobile = browser.new_context(
                  viewport={'width': 390, 'height': 844},
                  device_scale_factor=1,
                  is_mobile=True,
              )
              page = mobile.new_page()
              failures = capture(page)
              authenticate(page, '/rns?date=2026-08-21')
              wait_news(page)
              assert_shell(page, 'news', 0)
              news_header = mobile_header(page)
              page.screenshot(path=out / '07-news-unified-mobile.png', full_page=True)

              page.evaluate(
                  """
                  () => {
                    localStorage.setItem(
                      'smallcaps-ai-watchlist-v1',
                      JSON.stringify(['SPR'])
                    );
                  }
                  """
              )
              page.goto(f'{base}/rns?watchlist=1', wait_until='domcontentloaded')
              wait_news(page, watchlist=True)
              assert_shell(page, 'watchlist', 1)
              watchlist_header = mobile_header(page)

              page.goto(
                  f'{base}/?date=2026-08-21&state=aim_close',
                  wait_until='domcontentloaded',
              )
              wait_daily(page)
              assert_shell(page, 'daily', 1)
              daily_header = mobile_header(page)
              page.screenshot(path=out / '08-daily-unified-mobile.png', full_page=True)

              page.goto(f'{base}/company/SPR', wait_until='domcontentloaded')
              wait_company(page, 'SPR')
              assert_shell(page, 'news', 1)
              company_header = mobile_header(page)
              columns = page.locator('.company-position-main').evaluate(
                  '(el) => getComputedStyle(el).gridTemplateColumns'
              )
              if len(columns.split()) != 1:
                  raise AssertionError(f'Mobile company position did not collapse: {columns}')
              for selector in (
                  '#company-watch-toggle',
                  '.company-action',
                  '.company-current-evidence > summary',
              ):
                  box = page.locator(selector).first.bounding_box()
                  if box is None or box['height'] < 43.5:
                      raise AssertionError(f'Mobile target is too small: {selector} {box}')
              page.screenshot(path=out / '09-company-unified-mobile.png', full_page=True)

              headers = {
                  'news': news_header,
                  'watchlist': watchlist_header,
                  'daily': daily_header,
                  'company': company_header,
              }
              for name, header in headers.items():
                  if header['navTop'] < header['brandBottom'] - 1:
                      raise AssertionError(f'{name} navigation overlaps the brand row: {header}')
                  if header['navHeight'] < 43.5 or header['signOutHeight'] < 43.5:
                      raise AssertionError(f'{name} shared controls are too small: {header}')
              heights = [item['headerHeight'] for item in headers.values()]
              if max(heights) - min(heights) > 2:
                  raise AssertionError(f'Mobile headers are not one component: {headers}')

              footer_targets = page.locator('.product-footer-links a').evaluate_all(
                  'els => els.map(el => el.getBoundingClientRect().height)'
              )
              if not footer_targets or min(footer_targets) < 43.5:
                  raise AssertionError(f'Mobile footer targets are too small: {footer_targets}')
              assert_clean(failures, 'mobile unified product')
              mobile.close()
              browser.close()
          PY

      - name: Reject runtime and frontend failures
        run: |
          if grep -En 'Traceback \(most recent call last\)|Uncaught app exception|company-api-error|monitoring-api-error|newsroom-api-error' /tmp/scbb-pass5-audit/web.log; then
            cat /tmp/scbb-pass5-audit/web.log
            exit 1
          fi

      - name: Upload unified-product audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallcaps-pass5-unified-product-audit
          path: /tmp/scbb-pass5-audit
          if-no-files-found: error
          retention-days: 90

name: scbb-pass5-unified-product-audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scbb-pass5-unified-product-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unified-investor-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///data/scbb-pass5-preview.db
      PRIVATE_BETA_MODE: "true"
      APP_BETA_PASSWORD: preview-access
      APP_ADMIN_PASSWORD: preview-admin
      MARKET_DATA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node --check frontend/assets/research.js
          node --check frontend/assets/company.js
          node --check frontend/assets/company-journey.js

      - name: Seed deterministic unified product data
        run: |
          rm -f data/scbb-pass5-preview.db
          python -m jobs.seed_launch_preview
          python -m jobs.seed_pass1_preview

      - name: Start the private-beta product
        shell: bash
        run: |
          mkdir -p /tmp/scbb-pass5-audit
          python -m uvicorn web_app:app --host 127.0.0.1 --port 8501 \
            > /tmp/scbb-pass5-audit/web.log 2>&1 &
          echo $! > /tmp/scbb-pass5-web.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/api/v1/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8501/api/v1/company/SPR >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scbb-pass5-audit/web.log
          exit 1

      - name: Validate Feed and Company Intelligence round-trip
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          from playwright.sync_api import expect, sync_playwright

          out = Path('/tmp/scbb-pass5-audit')
          base = 'http://127.0.0.1:8501'

          def no_overflow(page):
              dims = page.evaluate(
                  """
                  () => ({
                    client: document.documentElement.clientWidth,
                    scroll: document.documentElement.scrollWidth,
                    body: document.body.scrollWidth,
                  })
                  """
              )
              if dims['scroll'] > dims['client'] + 2 or dims['body'] > dims['client'] + 2:
                  raise AssertionError(f'Document clips horizontally: {dims}')

          def no_duplicate_ids(page):
              duplicates = page.evaluate(
                  """
                  () => {
                    const counts = new Map();
                    document.querySelectorAll('[id]').forEach((node) => counts.set(node.id, (counts.get(node.id) || 0) + 1));
                    return [...counts.entries()].filter(([, count]) => count > 1);
                  }
                  """
              )
              if duplicates:
                  raise AssertionError(f'Duplicate DOM ids: {duplicates}')

          def authenticate(page, destination):
              page.goto(f'{base}{destination}', wait_until='domcontentloaded')
              page.get_by_text('PRIVATE BETA ACCESS', exact=True).wait_for(timeout=30000)
              expect(page.locator('input[name="next"]')).to_have_value(destination)
              page.get_by_label('ACCESS CODE', exact=True).fill('preview-access')
              page.get_by_role('button', name='ENTER SMALLCAPS.AI', exact=True).click()
              page.wait_for_url(f'{base}{destination}', timeout=30000)

          def wait_feed(page, source_id=None):
              page.get_by_role('heading', name='Facts. No fluff.', exact=True).wait_for(timeout=30000)
              page.locator('article.monitor-row').first.wait_for(timeout=30000)
              if source_id:
                  row = page.locator(f'article.monitor-row[data-source-id="{source_id}"]')
                  row.wait_for(timeout=30000)
                  expect(row.locator('button.row-toggle')).to_have_attribute('aria-expanded', 'true')
                  row.locator('.expanded-research:not([hidden])').wait_for(timeout=30000)
                  return row
              return None

          def wait_company(page, ticker):
              page.get_by_role('heading', name=ticker, exact=True).wait_for(timeout=30000)
              page.locator('[data-company-section="current-view"]').wait_for(timeout=30000)

          with sync_playwright() as p:
              browser = p.chromium.launch()

              desktop = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = desktop.new_page()
              destination = '/?date=2026-08-21&open=spr-preview-buyback'
              authenticate(page, destination)
              row = wait_feed(page, 'spr-preview-buyback')
              expect(page.locator('#active-day')).to_have_text('21 Aug 2026')
              expect(row.locator('a.company-research-link')).to_have_attribute('href', '/company/SPR')
              expect(page.locator('#feed-mode')).to_have_text('Key News')
              expect(page.locator('article.monitor-row')).to_have_count(5)
              no_overflow(page)
              no_duplicate_ids(page)
              page.screenshot(path=out / '01-key-news-deep-link-desktop.png', full_page=True)

              page.locator('#material-toggle').click()
              expect(page.locator('#feed-mode')).to_have_text('All News')
              expect(page.locator('article.monitor-row')).to_have_count(6)
              page.locator('#filters-toggle').click()
              expect(page.locator('#filter-panel')).to_be_visible()
              page.locator('#search-filter').fill('Trellus')
              expect(page.locator('article.monitor-row')).to_have_count(1)
              expect(page.locator('article.monitor-row .ticker')).to_have_text('TRLS')
              page.get_by_role('button', name='Reset filters', exact=True).click()
              expect(page.locator('#feed-mode')).to_have_text('Key News')
              page.screenshot(path=out / '02-filtered-feed-desktop.png', full_page=True)

              springfield = page.locator('article.monitor-row[data-source-id="spr-preview-buyback"]')
              springfield.locator('a.company-research-link').click()
              wait_company(page, 'SPR')
              expect(page.locator('.company-feed-link')).to_have_count(2)
              no_overflow(page)
              no_duplicate_ids(page)
              page.screenshot(path=out / '03-company-roundtrip-desktop.png', full_page=True)

              page.get_by_role('link', name='OPEN IN RNS FEED →', exact=True).click()
              page.wait_for_url(f'{base}/?date=2026-08-21&open=spr-preview-buyback', timeout=30000)
              wait_feed(page, 'spr-preview-buyback')
              query = parse_qs(urlparse(page.url).query)
              if query.get('date') != ['2026-08-21'] or query.get('open') != ['spr-preview-buyback']:
                  raise AssertionError(f'Company-to-news deep link lost state: {page.url}')
              page.screenshot(path=out / '04-company-to-news-desktop.png', full_page=True)
              desktop.close()

              mobile = browser.new_context(viewport={'width': 390, 'height': 844}, device_scale_factor=1, is_mobile=True)
              page = mobile.new_page()
              authenticate(page, '/company/SPR')
              wait_company(page, 'SPR')
              feed_link = page.locator('.company-feed-link').first
              feed_link.click()
              page.wait_for_url(f'{base}/?date=2026-08-21&open=spr-preview-buyback', timeout=30000)
              row = wait_feed(page, 'spr-preview-buyback')
              columns = row.locator('.news-row-head').evaluate('(el) => getComputedStyle(el).gridTemplateColumns')
              if ' ' in columns.strip():
                  raise AssertionError(f'Mobile news header did not collapse: {columns}')
              toggle_box = row.locator('button.row-toggle').bounding_box()
              if toggle_box is None or toggle_box['height'] < 44:
                  raise AssertionError(f'Mobile news target is too small: {toggle_box}')
              no_overflow(page)
              no_duplicate_ids(page)
              page.screenshot(path=out / '05-key-news-mobile.png', full_page=True)

              page.get_by_role('button', name='Sign out', exact=True).click()
              page.get_by_text('PRIVATE BETA ACCESS', exact=True).wait_for(timeout=30000)
              mobile.close()
              browser.close()
          PY

      - name: Reject runtime and frontend failures
        run: |
          if grep -En 'Traceback \(most recent call last\)|Uncaught app exception|company-api-error|monitoring-api-error' /tmp/scbb-pass5-audit/web.log; then
            cat /tmp/scbb-pass5-audit/web.log
            exit 1
          fi

      - name: Upload unified-product audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallcaps-facts-no-fluff-unified-product-audit
          path: /tmp/scbb-pass5-audit
          if-no-files-found: error
          retention-days: 90

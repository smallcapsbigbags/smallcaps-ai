name: launch-repair-pass3-company-news

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-repair-pass3-company-news-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dense-company-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///data/launch-repair-pass3.db
      PRIVATE_BETA_MODE: "false"
      APP_BETA_PASSWORD: preview-access
      APP_ADMIN_PASSWORD: preview-admin
      MARKET_DATA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node --check frontend/assets/research.js
          node --check frontend/assets/news-pass3.js
          node --check frontend/assets/product-shell.js
          node --check frontend/assets/company-repo-pass1.js

      - name: Seed deterministic Company News data
        run: |
          rm -f data/launch-repair-pass3.db
          python -m jobs.seed_launch_preview
          python -m jobs.seed_pass1_preview

      - name: Start product
        shell: bash
        run: |
          mkdir -p /tmp/launch-repair-pass3
          python -m uvicorn web_app:app --host 127.0.0.1 --port 8501 \
            > /tmp/launch-repair-pass3/web.log 2>&1 &
          echo $! > /tmp/launch-repair-pass3/web.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/api/v1/health >/dev/null \
              && curl --fail --silent 'http://127.0.0.1:8501/api/v1/monitoring?date=2026-08-21&limit=20' >/tmp/launch-repair-pass3/feed.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/launch-repair-pass3/web.log
          exit 1

      - name: Validate isolated asset contract
        run: |
          python - <<'PY'
          import re
          import requests

          response = requests.get('http://127.0.0.1:8501/rns', timeout=10)
          response.raise_for_status()
          html = response.text
          if response.headers.get('cache-control') != 'no-store':
              raise AssertionError(response.headers)
          for retired in ('/assets/research.css', '/assets/company.css', '/assets/company-polish.css'):
              if retired in html:
                  raise AssertionError(f'Legacy stylesheet still loaded by Company News: {retired}')
          for asset in (
              'news.css',
              'news-interactions.css',
              'news-detail.css',
              'watchlist.css',
              'news-pass3.css',
              'news-pass3-polish.css',
              'product-shell.css',
              'investor-workflow.css',
              'watchlist.js',
              'research.js',
              'news-pass3.js',
              'product-shell.js',
              'investor-workflow.js',
              'company-repo-pass1.js',
          ):
              if re.search(rf'/assets/{re.escape(asset)}\?v=[0-9a-f]{{12}}', html) is None:
                  raise AssertionError(f'{asset} is not content fingerprinted')
          if '<body class="company-news-page product-page">' not in html:
              raise AssertionError('Company News shared product scope is missing')
          if 'data-product-nav="daily"' in html or 'The AIM Daily' in html:
              raise AssertionError('Retired Daily navigation remains customer-visible')
          PY

      - name: Audit desktop, mobile and forced-dark journeys
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          from playwright.sync_api import expect, sync_playwright

          base = 'http://127.0.0.1:8501'
          out = Path('/tmp/launch-repair-pass3')

          def capture(page):
              failures = []
              requests_seen = []
              page.on('pageerror', lambda error: failures.append(f'pageerror: {error}'))
              page.on('console', lambda message: failures.append(f'console: {message.text}') if message.type == 'error' else None)
              page.on('request', lambda request: requests_seen.append(request.url))
              return failures, requests_seen

          def assert_clean(failures, label):
              if failures:
                  raise AssertionError(f'{label}: {failures}')

          def assert_no_overflow(page):
              dims = page.evaluate(
                  """
                  () => ({
                    client: document.documentElement.clientWidth,
                    scroll: document.documentElement.scrollWidth,
                    body: document.body.scrollWidth,
                    duplicates: [...document.querySelectorAll('[id]')]
                      .map(node => node.id)
                      .filter((id, index, values) => values.indexOf(id) !== index),
                  })
                  """
              )
              if dims['scroll'] > dims['client'] + 2 or dims['body'] > dims['client'] + 2:
                  raise AssertionError(f'Document clips horizontally: {dims}')
              if dims['duplicates']:
                  raise AssertionError(f'Duplicate DOM ids: {dims}')

          def assert_shared_nav(page):
              links = page.locator('nav[aria-label="Primary navigation"] a').evaluate_all(
                  "els => els.map(el => ({text: el.childNodes[0].textContent.trim(), href: el.getAttribute('href')}))"
              )
              expected = [
                  {'text': 'News', 'href': '/rns'},
                  {'text': 'Watchlist', 'href': '/rns?watchlist=1'},
              ]
              if links != expected:
                  raise AssertionError(f'Navigation is not minimal: {links}')
              expect(page.locator('[data-product-nav="news"]')).to_have_attribute('aria-current', 'page')
              expect(page.locator('[data-company-search-input]')).to_be_visible()

          def wait_feed(page):
              page.get_by_role('heading', name='Facts. No fluff.', exact=True).wait_for(timeout=30000)
              page.locator('article.monitor-row').first.wait_for(timeout=30000)
              expect(page.locator('article.monitor-row')).to_have_count(5)
              expect(page.locator('#feed-mode')).to_have_text('Key News')
              expect(page.locator('#feed-tagline')).to_have_text('What changed across AIM.')

          with sync_playwright() as p:
              browser = p.chromium.launch()

              desktop = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = desktop.new_page()
              failures, requests_seen = capture(page)
              page.goto(f'{base}/rns?date=2026-08-21', wait_until='domcontentloaded')
              wait_feed(page)
              assert_shared_nav(page)
              assert_no_overflow(page)

              springfield = page.locator('article.monitor-row[data-source-id="spr-preview-buyback"]')
              company_href = springfield.locator('a.company-research-link').get_attribute('href')
              parsed = urlparse(company_href)
              query = parse_qs(parsed.query)
              if parsed.path != '/company/SPR' or query.get('from') != ['news'] or query.get('open') != ['spr-preview-buyback'] or query.get('date') != ['2026-08-21']:
                  raise AssertionError(f'Company context link is incomplete: {company_href}')

              springfield.locator('.news-meta').click()
              springfield.locator('.expanded-research:not([hidden])').wait_for(timeout=30000)
              springfield.get_by_text('MATERIAL FACTS', exact=True).wait_for(timeout=30000)
              page.screenshot(path=out / '01-company-news-expanded-desktop.png', full_page=True)

              page.locator('#filters-toggle').click()
              expect(page.locator('#filter-panel')).to_be_visible()
              page.locator('#search-filter').fill('Trellus')
              expect(page.locator('article.monitor-row')).to_have_count(1)
              expect(page.locator('article.monitor-row .ticker')).to_have_text('TRLS')
              page.locator('#reset-filters').click()
              expect(page.locator('article.monitor-row')).to_have_count(5)

              asset_paths = {urlparse(url).path for url in requests_seen}
              for required in ('/assets/news.css', '/assets/news-pass3.css', '/assets/product-shell.css', '/assets/news-pass3.js', '/assets/product-shell.js', '/assets/company-repo-pass1.js'):
                  if required not in asset_paths:
                      raise AssertionError(f'Missing Company News asset request: {required}')
              assert_clean(failures, 'Desktop Company News')
              desktop.close()

              mobile = browser.new_context(viewport={'width': 390, 'height': 844}, device_scale_factor=1, is_mobile=True)
              page = mobile.new_page()
              failures, _ = capture(page)
              page.goto(f'{base}/rns?date=2026-08-21', wait_until='domcontentloaded')
              wait_feed(page)
              assert_shared_nav(page)
              assert_no_overflow(page)

              header = page.evaluate(
                  """
                  () => {
                    const brand = document.querySelector('.wordmark').getBoundingClientRect();
                    const nav = document.querySelector('.primary-nav').getBoundingClientRect();
                    const search = document.querySelector('.company-search').getBoundingClientRect();
                    const signOut = document.querySelector('.text-action').getBoundingClientRect();
                    return {
                      brandBottom: brand.bottom,
                      navTop: nav.top,
                      navBottom: nav.bottom,
                      navHeight: nav.height,
                      searchTop: search.top,
                      searchHeight: search.height,
                      signOutHeight: signOut.height,
                    };
                  }
                  """
              )
              if header['navTop'] < header['brandBottom'] - 1 or header['navHeight'] < 43.5 or header['signOutHeight'] < 43.5:
                  raise AssertionError(f'Mobile shared header failed: {header}')
              if header['searchTop'] < header['navBottom'] - 1 or header['searchHeight'] < 43.5:
                  raise AssertionError(f'Mobile search row failed: {header}')

              springfield = page.locator('article.monitor-row[data-source-id="spr-preview-buyback"]')
              springfield.locator('.news-meta').click()
              springfield.locator('.expanded-research:not([hidden])').wait_for(timeout=30000)
              springfield.get_by_text('MATERIAL FACTS', exact=True).wait_for(timeout=30000)
              page.screenshot(path=out / '02-company-news-expanded-mobile.png', full_page=True)
              assert_clean(failures, 'Mobile Company News')
              mobile.close()

              forced_dark = browser.new_context(viewport={'width': 1280, 'height': 900}, color_scheme='dark')
              page = forced_dark.new_page()
              failures, _ = capture(page)
              page.goto(f'{base}/rns?date=2026-08-21', wait_until='domcontentloaded')
              wait_feed(page)
              colours = page.evaluate(
                  """
                  () => ({
                    body: getComputedStyle(document.body).backgroundColor,
                    row: getComputedStyle(document.querySelector('.monitor-row')).backgroundColor,
                  })
                  """
              )
              if colours != {'body': 'rgb(245, 246, 248)', 'row': 'rgb(255, 255, 255)'}:
                  raise AssertionError(f'Forced dark preference changed Company News surfaces: {colours}')
              assert_clean(failures, 'Forced-dark Company News')
              forced_dark.close()

              browser.close()
          PY

      - name: Reject runtime failures
        run: |
          if grep -En 'Traceback \(most recent call last\)|Uncaught app exception|monitoring-api-error|company-api-error' /tmp/launch-repair-pass3/web.log; then
            cat /tmp/launch-repair-pass3/web.log
            exit 1
          fi

      - name: Upload Pass 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-repair-pass3-company-news-evidence
          path: /tmp/launch-repair-pass3
          if-no-files-found: error
          retention-days: 90

name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smallcaps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smallcaps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smallcaps_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall analyst api database ingestion jobs market product ui pipeline.py settings.py streamlit_app.py web_app.py
      - run: python -m json.tool benchmarks/cases.json > /dev/null
      - run: python -m json.tool benchmarks/company_memory_cases.json > /dev/null
      - run: python -m json.tool benchmarks/analyst_intelligence_cases.json > /dev/null
      - run: python -m json.tool benchmarks/analyst_intelligence_controls.json > /dev/null
      - run: python -m json.tool benchmarks/triage_cases.json > /dev/null
      - run: python -m json.tool benchmarks/triage_evidence_cases.json > /dev/null
      - run: python -m json.tool benchmarks/aim_daily_editor_cases.json > /dev/null
      - run: python -m json.tool benchmarks/aim_daily_editor_evolution_cases.json > /dev/null
      - run: python -m json.tool benchmarks/aim_daily_newsroom_cases.json > /dev/null
      - run: python -m json.tool benchmarks/radar_cases.json > /dev/null
      - run: python -m json.tool railway.json > /dev/null
      - run: python -m json.tool railway.ingest.json > /dev/null
      - run: python -m json.tool railway.prices.json > /dev/null
      - run: python -m json.tool railway.company-memory-benchmark.json > /dev/null
      - run: python -m json.tool railway.company-memory-live.json > /dev/null
      - run: python -m json.tool railway.analyst31-preflight.json > /dev/null
      - run: python -m jobs.run_intelligence_benchmark --cases benchmarks/analyst_intelligence_cases.json --output /tmp/analyst-intelligence-results.json
      - run: python -m jobs.run_intelligence_benchmark --cases benchmarks/analyst_intelligence_controls.json --output /tmp/analyst-intelligence-controls.json
      - run: python -m jobs.run_triage_benchmark --metadata benchmarks/triage_cases.json --evidence benchmarks/triage_evidence_cases.json --output /tmp/triage-results.json
      - run: python -m jobs.run_daily_editor_benchmark --cases benchmarks/aim_daily_editor_cases.json --output /tmp/aim-daily-editor-results.json
      - run: python -m jobs.run_daily_editor_evolution_benchmark --cases benchmarks/aim_daily_editor_evolution_cases.json --output /tmp/aim-daily-evolution-results.json
      - run: python -m jobs.run_newsroom_benchmark --cases benchmarks/aim_daily_newsroom_cases.json --output /tmp/aim-daily-newsroom-results.json
      - run: python -m jobs.run_radar_benchmark --cases benchmarks/radar_cases.json --output /tmp/aim-radar-results.json
      - run: pytest -q

name: pass4-hardening-snapshot

on:
  push:
    branches: ["pass4-post-merge-hardening"]
    paths:
      - ".github/workflows/pass4-hardening-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack repository
        run: tar --exclude=.git -czf /tmp/pass4-hardening-src.tar.gz .
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pass4-hardening-source
          path: /tmp/pass4-hardening-src.tar.gz
          retention-days: 1

name: rnsrepo-pin-corpus
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pin:
    if: contains(github.event.head_commit.message, '[rnsrepo-pin-corpus]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - uses: actions/download-artifact@v4
        with:
          name: rnsrepo-pass3-sources
          run-id: 35077642148
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/verified-corpus
      - name: Pin only the previously reviewed, hash-checked source data
        run: |
          python - <<'PY'
          from jobs.rnsrepo_corpus import load_corpus
          import gzip, json, io
          from pathlib import Path
          path = Path('benchmarks/rnsrepo/corpus.json.gz')
          assert not path.exists(), 'Never overwrite a pinned corpus automatically'
          corpus = dict(load_corpus(Path('/tmp/verified-corpus')))
          assert len(corpus) == 10
          raw = json.dumps(corpus, ensure_ascii=False, separators=(',', ':')).encode()
          output = io.BytesIO()
          with gzip.GzipFile(filename='', mode='wb', fileobj=output, mtime=0) as f:
              f.write(raw)
          path.write_bytes(output.getvalue())
          print('Pinned ten original public issuer texts; all manifest hashes match.')
          PY
      - name: Commit the data file only, without overwriting other work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- benchmarks/rnsrepo/corpus.json.gz
          test "$(git diff --cached --name-only)" = 'benchmarks/rnsrepo/corpus.json.gz'
          git commit -m 'Pin verified full-RNS acceptance snapshots; no AI calls'
          git push origin HEAD:main

name: pass4-release-cleanup

on:
  push:
    branches: ["company-repo-pass-4-hardening"]
    paths: [".github/workflows/pass4-release-cleanup.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: company-repo-pass-4-hardening
          fetch-depth: 0
      - name: Remove temporary Pass 4 implementation workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/pass4-dev-snapshot.yml \
            .github/workflows/pass4-implementation.yml \
            .github/workflows/pass4-release-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git commit -m "Remove temporary Pass 4 implementation workflows"
          git push origin HEAD:company-repo-pass-4-hardening

name: scbb-pass3-visual-audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scbb-pass3-visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitoring-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///data/scbb-pass3-preview.db
      PRIVATE_BETA_MODE: "false"
      APP_BETA_PASSWORD: preview-access
      APP_ADMIN_PASSWORD: preview-admin
      MARKET_DATA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node --check frontend/assets/research.js

      - name: Seed deterministic monitoring data
        run: |
          rm -f data/scbb-pass3-preview.db
          python -m jobs.seed_launch_preview
          python -m jobs.seed_pass1_preview

      - name: Start combined frontend and API
        shell: bash
        run: |
          mkdir -p /tmp/scbb-pass3-audit
          python -m uvicorn web_app:app --host 127.0.0.1 --port 8501 > /tmp/scbb-pass3-audit/web.log 2>&1 &
          echo $! > /tmp/scbb-pass3-web.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/api/v1/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/scbb-pass3-audit/web.log
          exit 1

      - name: Capture and validate Facts No Fluff feed
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import expect, sync_playwright

          out = Path('/tmp/scbb-pass3-audit')
          url = 'http://127.0.0.1:8501/rns'

          def no_overflow(page):
              dims = page.evaluate(
                  """
                  () => ({
                    client: document.documentElement.clientWidth,
                    scroll: document.documentElement.scrollWidth,
                    body: document.body.scrollWidth,
                  })
                  """
              )
              if dims['scroll'] > dims['client'] + 2 or dims['body'] > dims['client'] + 2:
                  raise AssertionError(f'Document clips horizontally: {dims}')

          def wait_feed(page):
              page.get_by_role('heading', name='Facts. No fluff.', exact=True).wait_for(timeout=30000)
              page.locator('article.monitor-row').first.wait_for(timeout=30000)
              expect(page.locator('#feed-mode')).to_have_text('Key News')

          def assert_key_news(page, *, mobile=False):
              wait_feed(page)
              expect(page.locator('article.monitor-row')).to_have_count(5)
              expect(page.locator('#material-toggle')).to_have_text('Show 1 other update')
              expect(page.locator('#filter-panel')).to_be_hidden()
              first = page.locator('article.monitor-row').first
              expect(first.locator('.impact-dot')).to_have_count(5)
              expect(first.locator('.signal-pill')).to_have_count(1)
              expect(first.locator('.news-headline')).not_to_be_empty()
              words = first.locator('.news-take').inner_text().strip().split()
              if len(words) > 45:
                  raise AssertionError(f'Feed take exceeds 45 words: {len(words)}')
              if mobile:
                  columns = first.locator('.news-row-head').evaluate('(el) => getComputedStyle(el).gridTemplateColumns')
                  if ' ' in columns.strip():
                      raise AssertionError(f'Mobile news row did not collapse: {columns}')

          with sync_playwright() as p:
              browser = p.chromium.launch()

              desktop = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = desktop.new_page()
              page.goto(url, wait_until='domcontentloaded')
              assert_key_news(page)
              no_overflow(page)

              computed = page.evaluate(
                  """
                  () => ({
                    background: getComputedStyle(document.body).backgroundColor,
                    surface: getComputedStyle(document.querySelector('article.monitor-row')).backgroundColor,
                    accent: getComputedStyle(document.querySelector('.wordmark strong')).color,
                    radius: getComputedStyle(document.querySelector('article.monitor-row')).borderRadius,
                  })
                  """
              )
              if computed['background'] != 'rgb(245, 246, 248)':
                  raise AssertionError(f'Wrong light page background: {computed}')
              if computed['surface'] != 'rgb(255, 255, 255)':
                  raise AssertionError(f'News row is not white: {computed}')
              if computed['accent'] != 'rgb(37, 99, 235)':
                  raise AssertionError(f'Wrong Smallcaps.ai blue: {computed}')
              if computed['radius'] not in {'9px', '9'}:
                  raise AssertionError(f'News row radius drifted: {computed}')

              page.get_by_role('button', name='Filters', exact=False).click()
              expect(page.locator('#filter-panel')).to_be_visible()
              for label in ('Company', 'News type', 'Signal', 'Materiality', 'Sort'):
                  page.get_by_text(label, exact=True).first.wait_for(timeout=30000)
              page.get_by_role('button', name='Filters', exact=False).click()

              page.locator('#material-toggle').click()
              expect(page.locator('#feed-mode')).to_have_text('All News')
              expect(page.locator('article.monitor-row')).to_have_count(6)
              expect(page.locator('#material-toggle')).to_have_text('Show key news only')

              first = page.locator('article.monitor-row').first
              first.locator('button.row-toggle').click()
              first.get_by_text('COMPANY NEWS DETAIL', exact=True).wait_for(timeout=30000)
              first.get_by_text('MATERIAL FACTS', exact=True).wait_for(timeout=30000)
              first.get_by_role('link', name='SOURCE ↗', exact=True).wait_for(timeout=30000)
              page.screenshot(path=out / '01-facts-no-fluff-desktop.png', full_page=True)
              desktop.close()

              mobile = browser.new_context(viewport={'width': 390, 'height': 844}, device_scale_factor=1, is_mobile=True)
              page = mobile.new_page()
              page.goto(url, wait_until='domcontentloaded')
              assert_key_news(page, mobile=True)
              no_overflow(page)
              page.screenshot(path=out / '02-facts-no-fluff-mobile.png', full_page=True)
              mobile.close()

              browser.close()
          PY

      - name: Reject frontend and runtime failures
        run: |
          if grep -En 'Traceback \(most recent call last\)|Uncaught app exception|monitoring-api-error' /tmp/scbb-pass3-audit/web.log; then
            cat /tmp/scbb-pass3-audit/web.log
            exit 1
          fi

      - name: Upload feed visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallcaps-facts-no-fluff-feed-audit
          path: /tmp/scbb-pass3-audit
          if-no-files-found: error
          retention-days: 90
